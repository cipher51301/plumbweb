<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網站施工中｜胖肉多的種植雜記</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* 本頁專屬樣式；導覽列與登入視窗使用 css/style.css */
        /* ===== 施工中專用頁面樣式 ===== */
        .construction-wrapper {
            max-width: 1000px;
            margin: 20px auto 40px auto;
            padding: 0 20px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .construction-img-box {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .construction-img-box img {
            border-radius: 12px;
            margin: 0 auto;
        }

        .click-hint {
            margin-top: 15px;
            font-size: 15px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./Shop.html">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>

            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
                
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 施工中主要內容區 -->
    <main class="construction-wrapper" id="constructionArea">
        <div class="construction-img-box">
            <!-- 直接指定英文檔名下簡潔乾淨的路徑 -->
            <img src="./images/under-construction.jpg" alt="網站正在建設中... 敬請期待！">
        </div>
        <div class="click-hint">（點擊頁面任意處即可返回上一頁）</div>
    </main>

    <!-- 會員登入浮動視窗 (Modal) -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
            <h2>會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="./maintenance.html">隱私權政策</a> / 
                <a href="./maintenance.html">購物與退換貨須知</a> / 
                <a href="./maintenance.html">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            updateCartCount();
            initNavAndModal();
            initBackAction();
        });

        function updateCartCount() {
            try {
                let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
                let totalCount = cart.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
                const cartNavBtn = document.getElementById('navCartCount');
                if (cartNavBtn) {
                    cartNavBtn.innerText = `🛒 (${totalCount})`;
                }
            } catch (e) {
                console.error("購物車數量解析失敗:", e);
            }
        }

        function initNavAndModal() {
            const menuToggle = document.getElementById("menuToggle");
            const navMenu = document.getElementById("navMenu");

            if (menuToggle && navMenu) {
                menuToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    navMenu.classList.toggle("active");
                });

                document.addEventListener("click", function (e) {
                    if (!navMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        navMenu.classList.remove("active");
                    }
                });
            }

            const triggerAuthBtns = document.querySelectorAll(".trigger-auth-btn");
            const loginModal = document.getElementById("loginModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const loginForm = document.getElementById("loginForm");

            triggerAuthBtns.forEach(btn => {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    if (navMenu) navMenu.classList.remove("active");
                    loginModal.classList.add("active");
                });
            });

            if (closeModalBtn) {
                closeModalBtn.addEventListener("click", function () {
                    loginModal.classList.remove("active");
                });
            }

            if (loginModal) {
                loginModal.addEventListener("click", function (e) {
                    if (e.target === loginModal) {
                        loginModal.classList.remove("active");
                    }
                });
            }

            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    alert("此視窗僅供展示使用，無實際登入功能。");
                    loginForm.reset();
                    loginModal.classList.remove("active");
                });
            }
        }

        /* 點擊頁面區域返回上一頁 */
        function initBackAction() {
            const constructionArea = document.getElementById("constructionArea");
            if (constructionArea) {
                constructionArea.addEventListener("click", function() {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        }
    </script>
</body>
</html>
