<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="胖肉多的種植雜記，記錄多肉、玫瑰與各種植物的種植經驗。">
    <title>胖肉多的種植雜記 - 種植雜記</title>
    <link rel="stylesheet" href="./css/style.css">

    <!-- SheetJS：讀取同目錄的「種植雜記.xlsx」 -->
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="./js/main.js"></script>

    <!-- 本頁專屬樣式；導覽列與登入視窗樣式共用 css/style.css -->
    <style>
        .journal-wrapper {
            max-width: 1200px;
            margin: 30px auto 50px;
            padding: 0 20px;
        }
        .journal-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .journal-header .line {
            width: 180px;
            height: 3px;
            background-color: #3b669e;
            flex: 0 1 180px;
        }
        .journal-header h1 {
            margin: 0;
            color: #1a1a1a;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 25px;
            align-items: start;
        }
        .journal-card {
            min-width: 0;
            padding: 12px;
            border: 2px solid #3b669e;
            border-radius: 12px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .journal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(59, 102, 158, .2);
        }
        .journal-card:focus-visible,
        .page-btn:focus-visible,
        .page-num:focus-visible {
            outline: 3px solid #1d5fa7;
            outline-offset: 3px;
        }
        .card-img-box {
            width: 100%;
            height: 180px;
            border: 2px solid #3b669e;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-title-text {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 10px;
            color: #333;
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.4;
            text-align: center;
            overflow-wrap: anywhere;
        }
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 40px;
            color: #333;
            font-size: 1.15rem;
        }
        .page-btn {
            padding: 5px 10px;
            border: 0;
            background: none;
            color: #333;
            font-size: 1.15rem;
            cursor: pointer;
            transition: color .2s ease;
        }
        .page-btn:hover:not(:disabled) {
            color: #3b669e;
            font-weight: bold;
        }
        .page-btn:disabled { color: #ccc; cursor: not-allowed; }
        .page-numbers { display: flex; gap: 10px; align-items: center; }
        .page-num {
            padding: 2px 8px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }
        .page-num.active {
            color: #3b669e;
            font-weight: bold;
            text-decoration: underline;
        }
        .status-message {
            grid-column: 1 / -1;
            padding: 30px 0;
            color: #666;
            font-size: 1.2rem;
            text-align: center;
        }
        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: minmax(0, 1fr); }
            .journal-header { gap: 12px; margin-bottom: 28px; }
            .journal-header .line { width: auto; flex: 1 1 auto; }
            .journal-header h1 { font-size: 1.8rem; }
            .pagination-container { gap: 8px; flex-wrap: wrap; font-size: 1rem; }
            .page-btn { font-size: 1rem; }
            .page-numbers { gap: 4px; flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>
            <nav class="nav-menu" id="navMenu" aria-label="主要導覽">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html" class="active" aria-current="page">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./Shop.html">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>
            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單" aria-controls="navMenu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="journal-wrapper">
        <div class="journal-header">
            <div class="line" aria-hidden="true"></div>
            <h1>種植雜記</h1>
            <div class="line" aria-hidden="true"></div>
        </div>
        <div class="cards-grid" id="cardsGrid" aria-live="polite">
            <div class="status-message">資料載入中...</div>
        </div>
        <nav class="pagination-container" id="paginationBox" aria-label="文章分頁" style="display: none;">
            <button type="button" class="page-btn" id="prevBtn">上一頁</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button type="button" class="page-btn" id="nextBtn">下一頁</button>
        </nav>
    </main>

    <div class="modal-overlay" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn" aria-label="關閉登入視窗">&times;</button>
            <h2 id="loginModalTitle">會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>

                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <footer class="site-footer">

            </div>
            <div class="footer-col footer-right">

</body>
</html>
