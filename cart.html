<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 購物車</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ==========================================================================
           購物車頁面專用樣式
           ========================================================================== */
        .cart-wrapper {
            max-width: 1000px;
            margin: 30px auto 60px auto;
            padding: 0 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .cart-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }

        .cart-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .cart-container {
            border: 2px solid #3b669e;
            border-radius: 16px;
            padding: 30px;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        /* 購物車表格 */
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        .cart-table th, .cart-table td {
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .cart-table th {
            background-color: #f0f4f9;
            color: #3b669e;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .cart-item-img {
            width: 70px;
            height: 70px;
            border: 1px solid #3b669e;
            border-radius: 8px;
            object-fit: cover;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .qty-btn {
            background-color: #f0f4f9;
            border: 1px solid #3b669e;
            color: #3b669e;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .qty-btn:hover {
            background-color: #3b669e;
            color: #fff;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #a94442;
        }

        /* 結帳與總計金額區塊 */
        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #3b669e;
        }

        .total-price {
            font-size: 1.4rem;
            color: #222;
            font-weight: bold;
        }

        .total-price span {
            color: #3b669e;
            font-size: 1.6rem;
        }

        .checkout-btn {
            background-color: #3b669e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .checkout-btn:hover {
            background-color: #2a4c77;
        }

        .empty-cart-msg {
            text-align: center;
            font-size: 1.3rem;
            color: #666;
            padding: 40px 0;
        }

        @media (max-width: 600px) {
            .cart-table th:nth-child(2), .cart-table td:nth-child(2) { display: none; }
            .cart-summary { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="images/logo.jpg" alt="胖肉多的種植雜記 Logo">
                <span>胖肉多的種植雜記</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html">首頁</a>
                <a href="Journal.html">種植雜記</a>
                <a href="Knowledge.html">植栽知識庫</a>
                <a href="products.html">所有商品</a>
                <a href="BrandStory.html">品牌故事</a>
                <a href="ContactUs.html">聯絡我們</a>
            </nav>
            <div class="nav-icons">
                <a href="#" class="search-btn">🔍</a>
                <a href="cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="cart-wrapper">
        <div class="cart-header">
            <div class="line"></div>
            <h1>購物車</h1>
            <div class="line"></div>
        </div>

        <div class="cart-container" id="cartContainer">
            <!-- 動態渲染購物車表格或空白提示 -->
        </div>
    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="#">隱私權政策</a> / 
                <a href="#">購物與退換貨須知</a> / 
                <a href="#">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯：購物車渲染與跳轉至結帳頁面 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderCart();
            updateCartIconCount();
        });

        // 解析價格字串轉為數字 (例如 "NT$ 1,200" -> 1200)
        function parsePrice(priceStr) {
            if (typeof priceStr === 'number') return priceStr;
            if (!priceStr) return 0;
            const cleanStr = String(priceStr).replace(/[^\d.]/g, '');
            return parseFloat(cleanStr) || 0;
        }

        // 渲染購物車內容
        function renderCart() {
            const container = document.getElementById('cartContainer');
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart-msg">
                        <p>您的購物車目前是空的喔！</p>
                        <a href="products.html" style="color: #3b669e; font-weight: bold; text-decoration: underline;">前往選購商品</a>
                    </div>
                `;
                return;
            }

            let totalAmount = 0;
            let tableRowsHtml = '';

            cart.forEach((item, index) => {
                const itemPrice = parsePrice(item.price);
                const itemTotal = itemPrice * item.quantity;
                totalAmount += itemTotal;

                const imgSrc = item.imgName ? `images/${item.imgName}` : '';

                tableRowsHtml += `
                    <tr>
                        <td class="item-info">
                            ${imgSrc ? `<img src="${imgSrc}" class="cart-item-img" alt="${item.name}">` : '<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center;background:#eee;">無圖</div>'}
                            <span><strong>${item.name}</strong></span>
                        </td>
                        <td>NT$ ${itemPrice.toLocaleString()}</td>
                        <td>
                            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                            <span style="margin: 0 8px; font-weight: bold;">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </td>
                        <td style="font-weight: bold; color: #3b669e;">NT$ ${itemTotal.toLocaleString()}</td>
                        <td>
                            <button class="delete-btn" title="刪除商品" onclick="removeItem(${index})">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th style="text-align: left; padding-left: 20px;">商品名稱</th>
                            <th>單價</th>
                            <th>數量</th>
                            <th>小計</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRowsHtml}
                    </tbody>
                </table>
                <div class="cart-summary">
                    <div class="total-price">總計金額：<span>NT$ ${totalAmount.toLocaleString()}</span></div>
                    <button class="checkout-btn" onclick="goToCheckout()">前往結帳</button>
                </div>
            `;
        }

        // 修改數量
        function updateQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            if (!cart[index]) return;

            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            renderCart();
            updateCartIconCount();
        }

        // 移除單一商品
        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            renderCart();
            updateCartIconCount();
        }

        // 點擊「前往結帳」時，跳轉至結帳頁面 checkout.html
        function goToCheckout() {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            if (cart.length === 0) {
                alert("您的購物車目前沒有商品喔！");
                return;
            }
            window.location.href = 'checkout.html';
        }

        // 更新導覽列購物車數量
        function updateCartIconCount() {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartNavBtn = document.getElementById('navCartCount');
            if (cartNavBtn) {
                cartNavBtn.innerText = `🛒 (${totalCount})`;
            }
        }
    </script>
</body>
</html>
