<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 購物車</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== 頂部導覽列基本與響應式樣式 ===== */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .logo span {
            font-size: 20px;
            font-weight: bold;
            color: #333333;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-menu a {
            text-decoration: none;
            color: #333333;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #1d3557;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle {
            display: none;
            background-color: #000033;
            border: 2px solid #0056b3;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            flex-direction: column;
            justify-content: space-around;
            width: 42px;
            height: 38px;
            box-sizing: border-box;
        }
        .menu-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .auth-btn {
            display: inline-block;
            padding: 4px 12px;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            color: #1d3557;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
            background: transparent;
        }
        .auth-btn:hover {
            background-color: #1d3557;
            color: #ffffff;
        }

        .cart-btn {
            text-decoration: none;
            color: #333333;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                right: 0;
                width: 220px;
                background-color: #ffffff;
                border: 2.5px solid #0056b3;
                box-shadow: -4px 6px 15px rgba(0,0,0,0.15);
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 20px;
                gap: 18px;
                z-index: 1001;
            }

            .nav-menu.active {
                display: flex;
            }

            .nav-menu a {
                font-size: 22px;
                color: #222222;
                text-decoration: none;
                width: 100%;
                display: block;
                font-weight: normal;
            }
        }

        /* ===== 登入彈出視窗 (Modal) 樣式 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .login-modal {
            background-color: #ffffff;
            border: 2px solid #1d3557;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            box-sizing: border-box;
        }
        .login-modal .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
        }
        .login-modal .close-btn:hover {
            color: #000;
        }
        .login-modal h2 {
            text-align: center;
            font-size: 26px;
            color: #111;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: normal;
            letter-spacing: 2px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            font-size: 18px;
            color: #111;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .login-form input::placeholder {
            color: #b5b5b5;
            font-size: 13px;
        }
        .login-form .submit-btn {
            width: 100%;
            background-color: #00b04f;
            color: #ffffff;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            padding: 10px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
            letter-spacing: 4px;
        }
        .login-form .submit-btn:hover {
            background-color: #009643;
        }

        /* ===== 購物車頁面專用樣式 ===== */
        .cart-wrapper {
            max-width: 1000px;
            margin: 30px auto 60px auto;
            padding: 0 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .cart-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }

        .cart-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .cart-container {
            border: 2px solid #3b669e;
            border-radius: 16px;
            padding: 30px;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        .cart-table th, .cart-table td {
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .cart-table th {
            background-color: #f0f4f9;
            color: #3b669e;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .cart-item-img {
            width: 70px;
            height: 70px;
            border: 1px solid #3b669e;
            border-radius: 8px;
            object-fit: cover;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .qty-btn {
            background-color: #f0f4f9;
            border: 1px solid #3b669e;
            color: #3b669e;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .qty-btn:hover {
            background-color: #3b669e;
            color: #fff;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #a94442;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #3b669e;
        }

        .total-price {
            font-size: 1.4rem;
            color: #222;
            font-weight: bold;
        }

        .total-price span {
            color: #3b669e;
            font-size: 1.6rem;
        }

        .checkout-btn {
            background-color: #3b669e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .checkout-btn:hover {
            background-color: #2a4c77;
        }

        .empty-cart-msg {
            text-align: center;
            font-size: 1.3rem;
            color: #666;
            padding: 40px 0;
        }

        @media (max-width: 600px) {
            .cart-table th:nth-child(2), .cart-table td:nth-child(2) { display: none; }
            .cart-summary { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./Shop.html">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>

            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
                
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="cart-wrapper">
        <div class="cart-header">
            <div class="line"></div>
            <h1>購物車</h1>
            <div class="line"></div>
        </div>

        <div class="cart-container" id="cartContainer">
            <!-- 動態渲染購物車表格或空白提示 -->
        </div>
    </div>

    <!-- 會員登入浮動視窗 (Modal) -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
            <h2>會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="#">隱私權政策</a> / 
                <a href="#">購物與退換貨須知</a> / 
                <a href="#">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            updateCartIconCount();
            initNavAndModal();
            renderCart();
        });

        function initNavAndModal() {
            const menuToggle = document.getElementById("menuToggle");
            const navMenu = document.getElementById("navMenu");

            if (menuToggle && navMenu) {
                menuToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    navMenu.classList.toggle("active");
                });

                document.addEventListener("click", function (e) {
                    if (!navMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        navMenu.classList.remove("active");
                    }
                });
            }

            const triggerAuthBtns = document.querySelectorAll(".trigger-auth-btn");
            const loginModal = document.getElementById("loginModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const loginForm = document.getElementById("loginForm");

            triggerAuthBtns.forEach(btn => {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    if (navMenu) navMenu.classList.remove("active");
                    loginModal.classList.add("active");
                });
            });

            if (closeModalBtn) {
                closeModalBtn.addEventListener("click", function () {
                    loginModal.classList.remove("active");
                });
            }

            if (loginModal) {
                loginModal.addEventListener("click", function (e) {
                    if (e.target === loginModal) {
                        loginModal.classList.remove("active");
                    }
                });
            }

            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    alert("此視窗僅供展示使用，無實際登入功能。");
                    loginForm.reset();
                    loginModal.classList.remove("active");
                });
            }
        }

        function parsePrice(priceStr) {
            if (typeof priceStr === 'number') return priceStr;
            if (!priceStr) return 0;
            const cleanStr = String(priceStr).replace(/[^\d.]/g, '');
            return parseFloat(cleanStr) || 0;
        }

        function renderCart() {
            const container = document.getElementById('cartContainer');
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart-msg">
                        <p>您的購物車目前是空的喔！</p>
                        <a href="Shop.html" style="color: #3b669e; font-weight: bold; text-decoration: underline;">前往選購商品</a>
                    </div>
                `;
                return;
            }

            let totalAmount = 0;
            let tableRowsHtml = '';

            cart.forEach((item, index) => {
                const itemPrice = parsePrice(item.price);
                const itemTotal = itemPrice * item.quantity;
                totalAmount += itemTotal;

                const imgSrc = item.imgName ? `images/${item.imgName}` : '';

                tableRowsHtml += `
                    <tr>
                        <td class="item-info">
                            ${imgSrc ? `<img src="${imgSrc}" class="cart-item-img" alt="${item.name}">` : '<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center;background:#eee;">無圖</div>'}
                            <span><strong>${item.name}</strong></span>
                        </td>
                        <td>NT$ ${itemPrice.toLocaleString()}</td>
                        <td>
                            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                            <span style="margin: 0 8px; font-weight: bold;">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </td>
                        <td style="font-weight: bold; color: #3b669e;">NT$ ${itemTotal.toLocaleString()}</td>
                        <td>
                            <button class="delete-btn" title="刪除商品" onclick="removeItem(${index})">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th style="text-align: left; padding-left: 20px;">商品名稱</th>
                            <th>單價</th>
                            <th>數量</th>
                            <th>小計</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRowsHtml}
                    </tbody>
                </table>
                <div class="cart-summary">
                    <div class="total-price">總計金額：<span>NT$ ${totalAmount.toLocaleString()}</span></div>
                    <button class="checkout-btn" onclick="goToCheckout()">前往結帳</button>
                </div>
            `;
        }

        function updateQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            if (!cart[index]) return;

            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            renderCart();
            updateCartIconCount();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            renderCart();
            updateCartIconCount();
        }

        function goToCheckout() {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            if (cart.length === 0) {
                alert("您的購物車目前沒有商品喔！");
                return;
            }
            window.location.href = 'checkout.html';
        }

        function updateCartIconCount() {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartNavBtn = document.getElementById('navCartCount');
            if (cartNavBtn) {
                cartNavBtn.innerText = `🛒 (${totalCount})`;
            }
        }
    </script>
</body>
</html>
