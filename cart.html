<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!--【購物車】
        目的：從 localStorage 讀取 shoppingCart，顯示商品、數量、小計及結帳入口。
        HTML 管理內容與結構；CSS 管理外觀；JavaScript 管理互動與資料。
        提醒：id / class 常被 CSS 與 JS 引用，修改名稱前應先搜尋全站。
        若涉及商品、文章、購物車，則請保留路徑與既有資料格式。
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 購物車</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /*【說明】以下是此頁專屬 CSS；共用導覽列、登入視窗與頁尾放在 css/style.css。
          選擇器 .class 會套用至指定 class 的元素；@media 負責依螢幕寬度調整排版。 */
        /* 本頁專屬樣式；導覽列與登入視窗使用 css/style.css */
        /* ===== 購物車頁面專用樣式 ===== */
        .cart-wrapper {
            max-width: 1000px;
            margin: 30px auto 60px auto;
            padding: 0 20px;

        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .cart-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }

        .cart-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;

            letter-spacing: 2px;
        }

        .cart-container {
            border: 2px solid #3b669e;
            border-radius: 16px;
            padding: 30px;
            background-color: #ffffff;

        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        .cart-table th, .cart-table td {
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .cart-table th {
            background-color: #f0f4f9;
            color: #3b669e;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .cart-item-img {
            width: 70px;
            height: 70px;
            border: 1px solid #3b669e;
            border-radius: 8px;
            object-fit: cover;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .qty-btn {
            background-color: #f0f4f9;
            border: 1px solid #3b669e;
            color: #3b669e;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .qty-btn:hover {
            background-color: #3b669e;
            color: #fff;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #a94442;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #3b669e;
        }

        .total-price {
            font-size: 1.4rem;
            color: #222;
            font-weight: bold;
        }

        .total-price span {
            color: #3b669e;
            font-size: 1.6rem;
        }

        .checkout-btn {
            background-color: #3b669e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .checkout-btn:hover {
            background-color: #2a4c77;
        }

        .empty-cart-msg {
            text-align: center;
            font-size: 1.3rem;
            color: #666;
            padding: 40px 0;
        }

        @media (max-width: 600px) {
            .cart-table th:nth-child(2), .cart-table td:nth-child(2) { display: none; }
            .cart-summary { flex-direction: column; gap: 15px; }
        }
    </style>
    <script defer src="./js/login-notice.js"></script>
</head>
    <!--【說明】body 是可見頁面內容的起點；此處的 data-page 若存在，供 main.js 判斷頁面類型。 -->
<body>

    <!-- 頂部導覽列 (Navbar) -->
    <!--【說明】共用導覽列：使用 css/style.css；menuToggle、navMenu、loginModal 等元素由 JS 控制。 -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./Shop.html">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>

            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
                
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <!--【說明】購物車內容由 renderCart() 依瀏覽器 localStorage 的資料動態生成。 -->
    <div class="cart-wrapper">
        <div class="cart-header">
            <div class="line"></div>
            <h1>購物車</h1>
            <div class="line"></div>
        </div>

        <div class="cart-container" id="cartContainer">
            <!-- 動態渲染購物車表格或空白提示 -->
        </div>
    </div>

    <!-- 會員登入浮動視窗 (Modal) -->
    <!--【說明】登入展示視窗：送出表單只顯示提示，沒有實際帳號驗證或伺服器登入。 -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
            <h2>會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <!-- 頁尾 Footer -->
    <!--【說明】全站頁尾：以下三個尚未完成的說明頁，統一前往 maintenance.html。 -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="./maintenance.html">隱私權政策</a> / 
                <a href="./maintenance.html">購物與退換貨須知</a> / 
                <a href="./maintenance.html">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯 -->
    <script>
        //【說明】此段是頁面專用 JavaScript。DOMContentLoaded 可確保 HTML 元素已建立，再開始綁定事件。
        //【說明】如需調整外觀請改 CSS；如需調整按鈕行為才改事件處理函式。
        document.addEventListener("DOMContentLoaded", function() {
            updateCartIconCount();
            initNavAndModal();
            renderCart();
        });

        //【說明】註冊漢堡選單及展示型登入視窗的點擊、關閉與送出事件。

        function initNavAndModal() {
            const menuToggle = document.getElementById("menuToggle");
            const navMenu = document.getElementById("navMenu");

            if (menuToggle && navMenu) {
                menuToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    navMenu.classList.toggle("active");
                });

                document.addEventListener("click", function (e) {
                    if (!navMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        navMenu.classList.remove("active");
                    }
                });
            }

            const triggerAuthBtns = document.querySelectorAll(".trigger-auth-btn");
            const loginModal = document.getElementById("loginModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const loginForm = document.getElementById("loginForm");

            triggerAuthBtns.forEach(btn => {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    if (navMenu) navMenu.classList.remove("active");
                    loginModal.classList.add("active");
                });
            });

            if (closeModalBtn) {
                closeModalBtn.addEventListener("click", function () {
                    loginModal.classList.remove("active");
                });
            }

            if (loginModal) {
                loginModal.addEventListener("click", function (e) {
                    if (e.target === loginModal) {
                        loginModal.classList.remove("active");
                    }
                });
            }

            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    loginForm.reset();
                    loginModal.classList.remove("active");
                    showLoginNotice("此視窗僅供展示使用，\n尚未連接實際登入功能。");
                });
            }
        }

        //【說明】將商品價格中的 NT$、逗號等非數字字元清除後轉成數值。

        function parsePrice(priceStr) {
            if (typeof priceStr === 'number') return priceStr;
            if (!priceStr) return 0;
            const cleanStr = String(priceStr).replace(/[^\d.]/g, '');
            return parseFloat(cleanStr) || 0;
        }

        //【說明】以 shoppingCart 產生商品表格、數量按鈕、小計與總金額。

        function renderCart() {
            const container = document.getElementById('cartContainer');
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart-msg">
                        <p>您的購物車目前是空的喔！</p>
                        <a href="Shop.html" style="color: #3b669e; font-weight: bold; text-decoration: underline;">前往選購商品</a>
                    </div>
                `;
                return;
            }

            let totalAmount = 0;
            let tableRowsHtml = '';

            cart.forEach((item, index) => {
                const itemPrice = parsePrice(item.price);
                const itemTotal = itemPrice * item.quantity;
                totalAmount += itemTotal;

                const imgSrc = item.imgName ? `images/${item.imgName}` : '';

                tableRowsHtml += `
                    <tr>
                        <td class="item-info">
                            ${imgSrc ? `<img src="${imgSrc}" class="cart-item-img" alt="${item.name}">` : '<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center;background:#eee;">無圖</div>'}
                            <span><strong>${item.name}</strong></span>
                        </td>
                        <td>NT$ ${itemPrice.toLocaleString()}</td>
                        <td>
                            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                            <span style="margin: 0 8px; font-weight: bold;">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </td>
                        <td style="font-weight: bold; color: #3b669e;">NT$ ${itemTotal.toLocaleString()}</td>
                        <td>
                            <button class="delete-btn" title="刪除商品" onclick="removeItem(${index})">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th style="text-align: left; padding-left: 20px;">商品名稱</th>
                            <th>單價</th>
                            <th>數量</th>
                            <th>小計</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRowsHtml}
                    </tbody>
                </table>
                <div class="cart-summary">
                    <div class="total-price">總計金額：<span>NT$ ${totalAmount.toLocaleString()}</span></div>
                    <button class="checkout-btn" onclick="goToCheckout()">前往結帳</button>
                </div>
            `;
        }

        //【說明】增減指定商品數量、寫回 localStorage，並重新繪製購物車。

        function updateQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            if (!cart[index]) return;

            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            renderCart();
            updateCartIconCount();
        }

        //【說明】移除指定商品、儲存購物車並更新畫面。

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            renderCart();
            updateCartIconCount();
        }

        //【說明】確認購物車不為空，再切換到結帳頁。

        function goToCheckout() {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            if (cart.length === 0) {
                alert("您的購物車目前沒有商品喔！");
                return;
            }
            window.location.href = 'checkout.html';
        }

        //【說明】讀取 shoppingCart，更新頁首購物車數量。

        function updateCartIconCount() {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartNavBtn = document.getElementById('navCartCount');
            if (cartNavBtn) {
                cartNavBtn.innerText = `🛒 (${totalCount})`;
            }
        }
    </script>
</body>
</html>
