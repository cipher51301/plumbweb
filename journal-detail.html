<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 文章內容</title>
    <link rel="stylesheet" href="./css/style.css">

    <!-- SheetJS：讀取網站根目錄的「種植雜記.xlsx」 -->
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="./js/main.js"></script>

    <style>
        /* =====「文章內容頁」專用樣式；共用導覽列、登入視窗與頁尾使用 css/style.css ===== */
        .article-wrapper {
            max-width: 1000px;
            margin: 30px auto 50px auto;
            padding: 0 20px;
        }

        .article-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .article-header .line {
            height: 3px;
            width: 200px;
            background-color: #3b669e;
        }

        .article-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .article-container {
            border: 2px solid #3b669e;
            border-radius: 20px;
            padding: 40px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .article-img-box {
            width: 100%;
            max-width: 850px;
            height: 380px;
            border: 2px solid #3b669e;
            border-radius: 12px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .article-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-title {
            font-size: 1.8rem;
            color: #222222;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .article-content {
            width: 100%;
            max-width: 850px;
            font-size: 1.15rem;
            color: #444444;
            line-height: 1.8;
            text-align: justify;
            white-space: pre-line;
            margin-bottom: 20px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 600px;
            margin: 30px auto 0 auto;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            color: #333333;
            cursor: pointer;
            padding: 8px 20px;
            transition: color 0.2s ease, transform 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .nav-btn:hover:not(.disabled):not(:disabled) {
            color: #3b669e;
            font-weight: bold;
            transform: translateY(-2px);
        }

        .nav-btn.disabled,
        .nav-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .status-msg {
            font-size: 1.2rem;
            color: #666;
            padding: 50px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .article-container { padding: 20px; }
            .article-img-box { height: 250px; }
            .article-title { font-size: 1.4rem; }
            .article-content { font-size: 1rem; }
        }

    </style>
</head>
<body>
    <!-- 頂部導覽列：由共用 style.css 與 main.js 控制外觀及互動 -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>

            <nav class="nav-menu" id="navMenu" aria-label="主要導覽">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html" class="active" aria-current="page">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./Shop.html">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>

            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount" aria-label="購物車">🛒 (0)</a>
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單" aria-controls="navMenu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="article-wrapper">
        <div class="article-header">
            <div class="line" aria-hidden="true"></div>
            <h1>種植雜記</h1>
            <div class="line" aria-hidden="true"></div>
        </div>

        <article class="article-container" id="articleContainer" aria-live="polite">
            <div class="status-msg">文章載入中...</div>
        </article>

        <nav class="nav-buttons" id="navButtons" aria-label="文章導覽" style="display: none;">
            <button type="button" class="nav-btn" id="prevArticleBtn">上一篇</button>
            <button type="button" class="nav-btn" id="nextArticleBtn">下一篇</button>
        </nav>
    </main>

    <!-- 會員登入浮動視窗：展示用，登入功能由共用 main.js 處理 -->
    <div class="modal-overlay" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn" aria-label="關閉登入視窗">&times;</button>
            <h2 id="loginModalTitle">會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="./maintenance.html">隱私權政策</a> /
                <a href="./maintenance.html">購物與退換貨須知</a> /
                <a href="./maintenance.html">常見問題 FAQ</a>
            </div>
        </div>
    </footer>
</body>
</html>
