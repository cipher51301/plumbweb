<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 文章內容</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 引入 SheetJS 解析 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        /* ==========================================================================
           「文章內容顯示頁」專用網頁樣式 (依據設計圖精確校正)
           ========================================================================== */
        
        .article-wrapper {
            max-width: 1000px;
            margin: 30px auto 50px auto;
            padding: 0 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        /* 標題與藍色裝飾線 */
        .article-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .article-header .line {
            height: 3px;
            width: 200px;
            background-color: #3b669e;
        }

        .article-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        /* 主體外框卡片 (比照設計圖雙重邊框樣式) */
        .article-container {
            border: 2px solid #3b669e;
            border-radius: 20px;
            padding: 40px;
            background-color: #ffffff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 圖片內框 */
        .article-img-box {
            width: 100%;
            max-width: 850px;
            height: 380px;
            border: 2px solid #3b669e;
            border-radius: 12px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .article-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 文章標題 (B欄) */
        .article-title {
            font-size: 1.8rem;
            color: #222222;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* 文章內容 (C欄) */
        .article-content {
            width: 100%;
            max-width: 850px;
            font-size: 1.15rem;
            color: #444444;
            line-height: 1.8;
            text-align: justify;
            white-space: pre-line; /* 保留 Excel 中的換行符號 */
            margin-bottom: 20px;
        }

        /* 上一篇 / 下一篇 導覽按鈕 */
        .nav-buttons {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 600px;
            margin: 30px auto 0 auto;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            color: #333333;
            cursor: pointer;
            padding: 8px 20px;
            transition: color 0.2s ease, transform 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .nav-btn:hover:not(.disabled) {
            color: #3b669e;
            font-weight: bold;
            transform: translateY(-2px);
        }

        .nav-btn.disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        /* 讀取狀態提示 */
        .status-msg {
            font-size: 1.2rem;
            color: #666;
            padding: 50px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .article-container { padding: 20px; }
            .article-img-box { height: 250px; }
            .article-title { font-size: 1.4rem; }
            .article-content { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="images/logo.jpg" alt="胖肉多的種植雜記 Logo">
                <span>胖肉多的種植雜記</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html">首頁</a>
                <a href="Journal.html" class="active">種植雜記</a>
                <a href="Knowledge.html">植栽知識庫</a>
                <a href="Shop.html">資材選物店</a>
                <a href="BrandStory.html">品牌故事</a>
                <a href="ContactUs.html">聯絡我們</a>
            </nav>
            <div class="nav-icons">
                <a href="#" class="search-btn">🔍</a>
               <a href="cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="article-wrapper">
        
        <!-- 頁面標題 -->
        <div class="article-header">
            <div class="line"></div>
            <h1>種植雜記</h1>
            <div class="line"></div>
        </div>

        <!-- 主體文章卡片 -->
        <div class="article-container" id="articleContainer">
            <div class="status-msg">文章載入中...</div>
        </div>

        <!-- 上一篇 / 下一篇 控制導覽 -->
        <div class="nav-buttons" id="navButtons" style="display: none;">
            <button class="nav-btn" id="prevArticleBtn">上一篇</button>
            <button class="nav-btn" id="nextArticleBtn">下一篇</button>
        </div>

    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="#">隱私權政策</a> / 
                <a href="#">購物與退換貨須知</a> / 
                <a href="#">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯：解析 URL 參數並抓取 Excel 資料 -->
    <script>
        let currentId = 0;
        let totalArticles = 0;

        document.addEventListener("DOMContentLoaded", function() {
            // 從 URL 取得文章 ID，預設為 0
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            currentId = idParam !== null ? parseInt(idParam, 10) : 0;

            loadArticleData();
        });

        function loadArticleData() {
            fetch('種植雜記.xlsx')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('無法讀取 種植雜記.xlsx 檔案');
                    }
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const sheetName = '雜記';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        throw new Error(`找不到名為「${sheetName}」的資料表`);
                    }
                    
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonObjects = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                    // 解析資料列
                    const articles = [];
                    for (let i = 1; i < jsonRows.length; i++) {
                        const rowArray = jsonRows[i];
                        const rowObj = jsonObjects[i - 1] || {};

                        if (!rowArray || rowArray.length === 0 || rowArray.every(cell => cell === '')) {
                            continue;
                        }

                        let title = '';
                        let content = '';
                        let imgName = '';

                        // 物件 Key 解析
                        Object.keys(rowObj).forEach(key => {
                            const cleanKey = key.trim();
                            if (cleanKey === '標題' || cleanKey.includes('標題')) title = rowObj[key];
                            if (cleanKey === '文章內容' || cleanKey === '內容' || cleanKey.includes('內容')) content = rowObj[key];
                            if (cleanKey === '圖檔檔名' || cleanKey.includes('圖檔') || cleanKey.includes('檔名')) imgName = rowObj[key];
                        });

                        // 欄位備援（B欄：Index 1, C欄：Index 2, D欄：Index 3）
                        if (!title && rowArray[1] !== undefined) title = rowArray[1];
                        if (!content && rowArray[2] !== undefined) content = rowArray[2];
                        if (!imgName && rowArray[3] !== undefined) imgName = rowArray[3];

                        articles.push({
                            title: String(title).trim(),
                            content: String(content).trim(),
                            imgName: String(imgName).trim()
                        });
                    }

                    totalArticles = articles.length;

                    if (totalArticles === 0) {
                        document.getElementById('articleContainer').innerHTML = '<div class="status-msg">目前沒有文章資料。</div>';
                        return;
                    }

                    // 確保 ID 在合理範圍內
                    if (isNaN(currentId) || currentId < 0) currentId = 0;
                    if (currentId >= totalArticles) currentId = totalArticles - 1;

                    renderArticle(articles[currentId]);
                    setupNavigation();
                })
                .catch(error => {
                    console.error('讀取失敗:', error);
                    document.getElementById('articleContainer').innerHTML = `
                        <div class="status-msg" style="color: #c00;">
                            文章載入失敗，請確認資料檔「種植雜記.xlsx」是否位於正確位置。
                        </div>
                    `;
                });
        }

        // 渲染單篇文章
        function renderArticle(article) {
            const container = document.getElementById('articleContainer');
            const imgSrc = article.imgName ? `images/${article.imgName}` : '';

            container.innerHTML = `
                <div class="article-img-box">
                    ${imgSrc ? `<img src="${imgSrc}" alt="${article.title}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'color:#888;font-size:1.5rem;\\'>圖片</span>';">` : '<span style="color:#888;font-size:1.5rem;">圖片</span>'}
                </div>
                <div class="article-title">${article.title || '文章標題'}</div>
                <div class="article-content">${article.content || '文章內容'}</div>
            `;

            document.getElementById('navButtons').style.display = 'flex';
        }

        // 設定上一篇/下一篇按鈕事件
        function setupNavigation() {
            const prevBtn = document.getElementById('prevArticleBtn');
            const nextBtn = document.getElementById('nextArticleBtn');

            // 上一篇邏輯
            if (currentId > 0) {
                prevBtn.classList.remove('disabled');
                prevBtn.onclick = function() {
                    window.location.href = `journal-detail.html?id=${currentId - 1}`;
                };
            } else {
                prevBtn.classList.add('disabled');
                prevBtn.onclick = null;
            }

            // 下一篇邏輯
            if (currentId < totalArticles - 1) {
                nextBtn.classList.remove('disabled');
                nextBtn.onclick = function() {
                    window.location.href = `journal-detail.html?id=${currentId + 1}`;
                };
            } else {
                nextBtn.classList.add('disabled');
                nextBtn.onclick = null;
            }
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
