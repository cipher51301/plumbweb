<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!--【商品詳細資訊】
        目的：顯示指定商品資訊並提供加入購物車與前後商品切換。
        HTML 管理內容與結構；CSS 管理外觀；JavaScript 管理互動與資料。
        提醒：id / class 常被 CSS 與 JS 引用，修改名稱前應先搜尋全站。
        若涉及商品、文章、購物車，則保留路徑與既有資料格式。
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="胖肉多的種植雜記商品詳細資訊。">
    <title>胖肉多的種植雜記 - 商品詳細資訊</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="./js/main.js"></script>
    <style>
        /*【說明】以下是此頁專屬 CSS；共用導覽列、登入視窗與頁尾放在 css/style.css。
          選擇器 .class 會套用至指定 class 的元素；@media 負責依螢幕寬度調整排版。 */
        /* 商品詳細頁專用樣式；導覽列、登入視窗與頁尾沿用共用 style.css */
        .product-detail-wrapper {
            max-width: 1000px;
            margin: 30px auto 50px;
            padding: 0 20px;
        }
        .product-detail-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .product-detail-header .line {
            height: 3px;
            width: 200px;
            background-color: #3b669e;
        }
        .product-detail-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        .product-detail-container {
            border: 2px solid #3b669e;
            border-radius: 20px;
            padding: 40px;
            background-color: #fff;
            display: flex;
            gap: 40px;
            align-items: center;
        }
        .product-detail-img-box {
            flex: 1;
            min-width: 0;
            height: 380px;
            border: 2px solid #3b669e;
            border-radius: 12px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-detail-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-detail-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .product-detail-title {
            font-size: 1.8rem;
            color: #222;
            font-weight: bold;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }
        .product-detail-price {
            font-size: 1.6rem;
            color: #3b669e;
            font-weight: bold;
        }
        .product-detail-desc {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }
        .add-to-cart-big-btn {
            background-color: #3b669e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color .2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .add-to-cart-big-btn:hover {
            background-color: #2a4c77;
        }
        .add-to-cart-big-btn:focus-visible,
        .nav-btn:focus-visible {
            outline: 3px solid #f0ad4e;
            outline-offset: 3px;
        }
        .nav-buttons[hidden] {
            display: none !important;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 600px;
            margin: 30px auto 0;
        }
        .nav-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            color: #333;
            cursor: pointer;
            padding: 8px 20px;
            transition: color .2s ease;
            text-decoration: none;
        }
        .nav-btn:hover:not(:disabled) {
            color: #3b669e;
            font-weight: bold;
        }
        .nav-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }
        .status-msg {
            font-size: 1.2rem;
            color: #666;
            padding: 50px 0;
            text-align: center;
            width: 100%;
        }
        @media (max-width: 768px) {
            .product-detail-container {
                flex-direction: column;
                padding: 20px;
                gap: 24px;
            }
            .product-detail-img-box {
                width: 100%;
                height: 260px;
                flex: auto;
            }
            .product-detail-info {
                width: 100%;
                flex: auto;
            }
            .product-detail-header {
                gap: 12px;
            }
            .product-detail-header .line {
                width: min(16vw, 100px);
            }
            .product-detail-header h1 {
                font-size: 1.8rem;
            }
        }
        @media (max-width: 420px) {
            .product-detail-wrapper {
                padding: 0 12px;
            }
            .product-detail-container {
                padding: 14px;
            }
            .product-detail-title {
                font-size: 1.5rem;
            }
            .product-detail-price {
                font-size: 1.4rem;
            }
        }
    </style>
    <script defer src="./js/login-notice.js"></script>
</head>
    <!--【說明】body 是可見頁面內容的起點；此處的 data-page 若存在，供 main.js 判斷頁面類型。 -->
<body data-page="product-detail">
    <!-- 頂部導覽列 -->
    <!--【說明】共用導覽列：使用 css/style.css；menuToggle、navMenu、loginModal 等元素由 JS 控制。 -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>
            <nav class="nav-menu" id="navMenu">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./products.html" class="active">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>
            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount" aria-label="前往購物車">🛒 (0)</a>
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單" aria-expanded="false" aria-controls="navMenu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!--【說明】main 裡是本頁的主要內容；動態內容容器通常由 JS 依 id 尋找並填入資料。 -->
    <main class="product-detail-wrapper">
        <div class="product-detail-header">
            <div class="line" aria-hidden="true"></div>
            <h1>所有商品</h1>
            <div class="line" aria-hidden="true"></div>
        </div>
        <section class="product-detail-container" id="productContainer" aria-live="polite">
            <div class="status-msg">商品內容載入中...</div>
        </section>
        <nav class="nav-buttons" id="navButtons" aria-label="切換商品" hidden>
            <button type="button" class="nav-btn" id="prevProductBtn">上一頁</button>
            <button type="button" class="nav-btn" id="nextProductBtn">下一頁</button>
        </nav>
    </main>

    <!-- 會員登入浮動視窗 -->
    <!--【說明】登入展示視窗：送出表單只顯示提示，沒有實際帳號驗證或伺服器登入。 -->
    <div class="modal-overlay" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn" aria-label="關閉登入視窗">&times;</button>
            <h2 id="loginModalTitle">會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <!--【說明】全站頁尾：以下三個尚未完成的說明頁，統一前往 maintenance.html。 -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="./maintenance.html">隱私權政策</a> /
                <a href="./maintenance.html">購物與退換貨須知</a> /
                <a href="./maintenance.html">常見問題 FAQ</a>
            </div>
        </div>
    </footer>
</body>
</html>
