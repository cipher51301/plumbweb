<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 訂單結帳</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== 頂部導覽列基本與響應式樣式 ===== */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .logo span {
            font-size: 20px;
            font-weight: bold;
            color: #333333;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-menu a {
            text-decoration: none;
            color: #333333;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #1d3557;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle {
            display: none;
            background-color: #000033;
            border: 2px solid #0056b3;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            flex-direction: column;
            justify-content: space-around;
            width: 42px;
            height: 38px;
            box-sizing: border-box;
        }
        .menu-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .auth-btn {
            display: inline-block;
            padding: 4px 12px;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            color: #1d3557;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
            background: transparent;
        }
        .auth-btn:hover {
            background-color: #1d3557;
            color: #ffffff;
        }

        .cart-btn {
            text-decoration: none;
            color: #333333;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                right: 0;
                width: 220px;
                background-color: #ffffff;
                border: 2.5px solid #0056b3;
                box-shadow: -4px 6px 15px rgba(0,0,0,0.15);
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 20px;
                gap: 18px;
                z-index: 1001;
            }

            .nav-menu.active {
                display: flex;
            }

            .nav-menu a {
                font-size: 22px;
                color: #222222;
                text-decoration: none;
                width: 100%;
                display: block;
                font-weight: normal;
            }
        }

        /* ===== 登入與通用彈出視窗 (Modal) 樣式 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .login-modal {
            background-color: #ffffff;
            border: 2px solid #1d3557;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            box-sizing: border-box;
        }
        .login-modal .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
        }
        .login-modal .close-btn:hover {
            color: #000;
        }
        .login-modal h2 {
            text-align: center;
            font-size: 26px;
            color: #111;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: normal;
            letter-spacing: 2px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            font-size: 18px;
            color: #111;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .login-form input::placeholder {
            color: #b5b5b5;
            font-size: 13px;
        }
        .login-form .submit-btn {
            width: 100%;
            background-color: #00b04f;
            color: #ffffff;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            padding: 10px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
            letter-spacing: 4px;
        }
        .login-form .submit-btn:hover {
            background-color: #009643;
        }

        /* ===== 結帳頁面專用樣式 ===== */
        .checkout-wrapper {
            max-width: 1000px;
            margin: 30px auto 60px auto;
            padding: 0 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .checkout-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .checkout-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }

        .checkout-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            align-items: start;
        }

        .checkout-card {
            border: 2px solid #3b669e;
            border-radius: 16px;
            padding: 25px;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        .card-title {
            font-size: 1.3rem;
            color: #3b669e;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #3b669e;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            color: #333;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #d9534f;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b669e;
        }

        .order-item-list {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .item-detail {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-detail img {
            width: 50px;
            height: 50px;
            border: 1px solid #3b669e;
            border-radius: 6px;
            object-fit: cover;
        }

        .item-name {
            font-weight: bold;
            color: #333;
            font-size: 0.95rem;
        }

        .item-qty {
            font-size: 0.85rem;
            color: #666;
        }

        .item-price {
            font-weight: bold;
            color: #333;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1rem;
            color: #555;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #3b669e;
            font-size: 1.3rem;
            font-weight: bold;
            color: #222;
        }

        .summary-total span {
            color: #3b669e;
        }

        .submit-order-btn {
            width: 100%;
            background-color: #3b669e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .submit-order-btn:hover {
            background-color: #2a4c77;
        }

        .modal-box {
            background-color: #ffffff;
            border: 2px solid #3b669e;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .modal-title {
            font-size: 1.5rem;
            color: #3b669e;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .modal-msg {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-confirm-btn {
            background-color: #3b669e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-confirm-btn:hover {
            background-color: #2a4c77;
        }

        @media (max-width: 850px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- 頂部導覽列 (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./Shop.html">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>

            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
                
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="checkout-wrapper">
        <div class="checkout-header">
            <div class="line"></div>
            <h1>訂單結帳</h1>
            <div class="line"></div>
        </div>

        <div class="checkout-grid">
            <div class="checkout-card">
                <div class="card-title">收件人資訊</div>
                <form id="checkoutForm" onsubmit="handleOrderSubmit(event)">
                    <div class="form-group">
                        <label for="fullname">真實姓名 <span class="required">*</span></label>
                        <input type="text" id="fullname" class="form-control" placeholder="請輸入收件人姓名" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">聯絡電話 <span class="required">*</span></label>
                        <input type="tel" id="phone" class="form-control" placeholder="請輸入手機號碼" required>
                    </div>

                    <div class="form-group">
                        <label for="email">電子郵件 <span class="required">*</span></label>
                        <input type="email" id="email" class="form-control" placeholder="用於接收訂單通知" required>
                    </div>

                    <div class="form-group">
                        <label for="address">寄送地址 <span class="required">*</span></label>
                        <input type="text" id="address" class="form-control" placeholder="請輸入完整的收件地址" required>
                    </div>

                    <div class="form-group">
                        <label for="payment">付款方式 <span class="required">*</span></label>
                        <select id="payment" class="form-control" required>
                            <option value="ecpay">ECPay 綠界科技信用卡 / 超商付款</option>
                            <option value="transfer">銀行轉帳</option>
                            <option value="cod">貨到付款</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="note">訂單備註</label>
                        <textarea id="note" class="form-control" rows="3" placeholder="如有特別送貨需求請在此註明..."></textarea>
                    </div>

                    <button type="submit" class="submit-order-btn">確認提交訂單</button>
                </form>
            </div>

            <div class="checkout-card">
                <div class="card-title">訂單明細</div>
                <div class="order-item-list" id="orderItemList">
                    <!-- 動態渲染購物車商品 -->
                </div>

                <div class="summary-row">
                    <span>商品小計</span>
                    <span id="subtotalText">NT$ 0</span>
                </div>
                <div class="summary-row">
                    <span>運費</span>
                    <span>NT$ 0 (免運優惠)</span>
                </div>
                <div class="summary-total">
                    <span>總計</span>
                    <span id="totalText">NT$ 0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 示範用彈出視窗 (Modal) -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-box">
            <div class="modal-title">系統提示</div>
            <div class="modal-msg">示範用，無法進行結帳</div>
            <button class="modal-confirm-btn" onclick="confirmCheckout()">確認並返回首頁</button>
        </div>
    </div>

    <!-- 會員登入浮動視窗 (Modal) -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
            <h2>會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="#">隱私權政策</a> /
                <a href="#">購物與退換貨須知</a> /
                <a href="#">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            updateCartIconCount();
            initNavAndModal();
            renderOrderSummary();
        });

        function initNavAndModal() {
            const menuToggle = document.getElementById("menuToggle");
            const navMenu = document.getElementById("navMenu");

            if (menuToggle && navMenu) {
                menuToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    navMenu.classList.toggle("active");
                });

                document.addEventListener("click", function (e) {
                    if (!navMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        navMenu.classList.remove("active");
                    }
                });
            }

            const triggerAuthBtns = document.querySelectorAll(".trigger-auth-btn");
            const loginModal = document.getElementById("loginModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const loginForm = document.getElementById("loginForm");

            triggerAuthBtns.forEach(btn => {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    if (navMenu) navMenu.classList.remove("active");
                    loginModal.classList.add("active");
                });
            });

            if (closeModalBtn) {
                closeModalBtn.addEventListener("click", function () {
                    loginModal.classList.remove("active");
                });
            }

            if (loginModal) {
                loginModal.addEventListener("click", function (e) {
                    if (e.target === loginModal) {
                        loginModal.classList.remove("active");
                    }
                });
            }

            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    alert("此視窗僅供展示使用，無實際登入功能。");
                    loginForm.reset();
                    loginModal.classList.remove("active");
                });
            }
        }

        function parsePrice(priceStr) {
            if (typeof priceStr === 'number') return priceStr;
            if (!priceStr) return 0;
            const cleanStr = String(priceStr).replace(/[^\d.]/g, '');
            return parseFloat(cleanStr) || 0;
        }

        function renderOrderSummary() {
            const listContainer = document.getElementById('orderItemList');
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];

            if (cart.length === 0) {
                alert("您的購物車目前是空的！");
                window.location.href = "cart.html";
                return;
            }

            let total = 0;
            let listHtml = '';

            cart.forEach(item => {
                const price = parsePrice(item.price);
                const itemTotal = price * item.quantity;
                total += itemTotal;
                const imgSrc = item.imgName ? `images/${item.imgName}` : '';

                listHtml += `
                    <div class="order-item">
                        <div class="item-detail">
                            ${imgSrc ? `<img src="${imgSrc}" alt="${item.name}">` : '<div style="width:50px;height:50px;background:#eee;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#888;">無圖</div>'}
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-qty">數量：${item.quantity}</div>
                            </div>
                        </div>
                        <div class="item-price">NT$ ${itemTotal.toLocaleString()}</div>
                    </div>
                `;
            });

            listContainer.innerHTML = listHtml;
            document.getElementById('subtotalText').innerText = `NT$ ${total.toLocaleString()}`;
            document.getElementById('totalText').innerText = `NT$ ${total.toLocaleString()}`;
        }

        function handleOrderSubmit(e) {
            e.preventDefault();
            document.getElementById('checkoutModal').classList.add('active');
        }

        function confirmCheckout() {
            localStorage.removeItem('shoppingCart');
            window.location.href = 'index.html';
        }

        function updateCartIconCount() {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartNavBtn = document.getElementById('navCartCount');
            if (cartNavBtn) {
                cartNavBtn.innerText = `🛒 (${totalCount})`;
            }
        }
    </script>
</body>
</html>
