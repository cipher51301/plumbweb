<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 植栽知識庫</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 引入 SheetJS 解析 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        /* ===== 頂部導覽列基本與響應式樣式 ===== */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .logo span {
            font-size: 20px;
            font-weight: bold;
            color: #333333;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-menu a {
            text-decoration: none;
            color: #333333;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #1d3557;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle {
            display: none;
            background-color: #000033;
            border: 2px solid #0056b3;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            flex-direction: column;
            justify-content: space-around;
            width: 42px;
            height: 38px;
            box-sizing: border-box;
        }
        .menu-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .auth-btn {
            display: inline-block;
            padding: 4px 12px;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            color: #1d3557;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
            background: transparent;
        }
        .auth-btn:hover {
            background-color: #1d3557;
            color: #ffffff;
        }

        .cart-btn {
            text-decoration: none;
            color: #333333;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                right: 0;
                width: 220px;
                background-color: #ffffff;
                border: 2.5px solid #0056b3;
                box-shadow: -4px 6px 15px rgba(0,0,0,0.15);
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 20px;
                gap: 18px;
                z-index: 1001;
            }

            .nav-menu.active {
                display: flex;
            }

            .nav-menu a {
                font-size: 22px;
                color: #222222;
                text-decoration: none;
                width: 100%;
                display: block;
                font-weight: normal;
            }
        }

        /* ===== 登入彈出視窗 (Modal) 樣式 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .login-modal {
            background-color: #ffffff;
            border: 2px solid #1d3557;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            box-sizing: border-box;
        }
        .login-modal .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
        }
        .login-modal .close-btn:hover {
            color: #000;
        }
        .login-modal h2 {
            text-align: center;
            font-size: 26px;
            color: #111;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: normal;
            letter-spacing: 2px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            font-size: 18px;
            color: #111;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .login-form input::placeholder {
            color: #b5b5b5;
            font-size: 13px;
        }
        .login-form .submit-btn {
            width: 100%;
            background-color: #00b04f;
            color: #ffffff;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            padding: 10px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
            letter-spacing: 4px;
        }
        .login-form .submit-btn:hover {
            background-color: #009643;
        }

        /* ===== 「植栽知識庫」頁面專用樣式 ===== */
        .journal-wrapper {
            max-width: 1200px;
            margin: 30px auto 50px auto;
            padding: 0 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .journal-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .journal-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }

        .journal-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            align-items: start;
        }

        .journal-card {
            border: 2px solid #3b669e;
            border-radius: 12px;
            padding: 12px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .journal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(59, 102, 158, 0.2);
        }

        .card-img-box {
            width: 100%;
            height: 180px;
            border: 2px solid #3b669e;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-category-tag {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #3b669e;
            background-color: #f0f4f9;
            border: 1px solid #3b669e;
            border-radius: 20px;
            padding: 2px 12px;
            font-weight: 600;
            text-align: center;
        }

        .card-title-text {
            margin-top: 8px;
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: #333333;
            font-weight: 500;
            text-align: center;
            line-height: 1.4;
            width: 100%;
            word-break: break-word;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 40px;
            font-size: 1.15rem;
            color: #333333;
        }

        .page-btn {
            background: none;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            color: #333333;
            padding: 5px 10px;
            transition: color 0.2s ease;
        }

        .page-btn:hover:not(:disabled) {
            color: #3b669e;
            font-weight: bold;
        }

        .page-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-num {
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .page-num.active {
            font-weight: bold;
            color: #3b669e;
            text-decoration: underline;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            padding: 30px 0;
            line-height: 1.8;
        }

        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html" class="active">植栽知識庫</a>
                <a href="./Shop.html">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>

            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
                
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="journal-wrapper">
        <div class="journal-header">
            <div class="line"></div>
            <h1>植栽知識庫</h1>
            <div class="line"></div>
        </div>

        <div class="cards-grid" id="cardsGrid">
            <div class="status-message">資料載入中...</div>
        </div>

        <div class="pagination-container" id="paginationBox" style="display: none;">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一頁</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一頁</button>
        </div>
    </div>

    <!-- 會員登入浮動視窗 (Modal) -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
            <h2>會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="#">隱私權政策</a> / 
                <a href="#">購物與退換貨須知</a> / 
                <a href="#">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯 -->
    <script>
        let allData = [];
        let currentPage = 1;
        const itemsPerPage = 12;

        document.addEventListener("DOMContentLoaded", function() {
            updateCartCount();
            initNavAndModal();
            loadExcelData();
        });

        function updateCartCount() {
            try {
                let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
                let totalCount = cart.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
                const cartNavBtn = document.getElementById('navCartCount');
                if (cartNavBtn) {
                    cartNavBtn.innerText = `🛒 (${totalCount})`;
                }
            } catch (e) {
                console.error("購物車數量解析失敗:", e);
            }
        }

        function initNavAndModal() {
            const menuToggle = document.getElementById("menuToggle");
            const navMenu = document.getElementById("navMenu");

            if (menuToggle && navMenu) {
                menuToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    navMenu.classList.toggle("active");
                });

                document.addEventListener("click", function (e) {
                    if (!navMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        navMenu.classList.remove("active");
                    }
                });
            }

            const triggerAuthBtns = document.querySelectorAll(".trigger-auth-btn");
            const loginModal = document.getElementById("loginModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const loginForm = document.getElementById("loginForm");

            triggerAuthBtns.forEach(btn => {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    if (navMenu) navMenu.classList.remove("active");
                    loginModal.classList.add("active");
                });
            });

            if (closeModalBtn) {
                closeModalBtn.addEventListener("click", function () {
                    loginModal.classList.remove("active");
                });
            }

            if (loginModal) {
                loginModal.addEventListener("click", function (e) {
                    if (e.target === loginModal) {
                        loginModal.classList.remove("active");
                    }
                });
            }

            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    alert("此視窗僅供展示使用，無實際登入功能。");
                    loginForm.reset();
                    loginModal.classList.remove("active");
                });
            }
        }

        function loadExcelData() {
            const fileName = encodeURIComponent('植栽知識庫.xlsx');

            fetch(`./${fileName}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('無法讀取 植栽知識庫.xlsx 檔案');
                    }
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = '知識庫';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        throw new Error(`找不到名為「${sheetName}」的資料表`);
                    }
                    
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonObjects = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                    allData = [];
                    for (let i = 1; i < jsonRows.length; i++) {
                        const rowArray = jsonRows[i];
                        const rowObj = jsonObjects[i - 1] || {};

                        if (!rowArray || rowArray.length === 0 || rowArray.every(cell => cell === '')) {
                            continue;
                        }

                        let categoryMain = '';
                        let categorySub = '';
                        let title = '';
                        let imgName = '';

                        Object.keys(rowObj).forEach(key => {
                            const cleanKey = key.trim();
                            if (cleanKey === '主分類' || cleanKey.includes('主分類')) categoryMain = rowObj[key];
                            if (cleanKey === '次分類' || cleanKey.includes('次分類')) categorySub = rowObj[key];
                            if (cleanKey === '文章標題' || cleanKey === '標題' || cleanKey.includes('標題')) title = rowObj[key];
                            if (cleanKey === '圖檔檔名' || cleanKey.includes('圖檔') || cleanKey.includes('檔名')) imgName = rowObj[key];
                        });

                        if (!categoryMain && rowArray[1] !== undefined) categoryMain = rowArray[1];
                        if (!categorySub && rowArray[2] !== undefined) categorySub = rowArray[2];
                        if (!title && rowArray[3] !== undefined) title = rowArray[3];
                        if (!imgName && rowArray[5] !== undefined) imgName = rowArray[5];

                        let categoryTag = '';
                        const mainStr = String(categoryMain).trim();
                        const subStr = String(categorySub).trim();
                        if (mainStr && subStr) {
                            categoryTag = `${mainStr} / ${subStr}`;
                        } else {
                            categoryTag = mainStr || subStr;
                        }

                        allData.push({
                            categoryTag: categoryTag,
                            title: String(title).trim(),
                            imgName: String(imgName).trim()
                        });
                    }

                    currentPage = 1;
                    renderPage();
                })
                .catch(error => {
                    console.error('讀取失敗:', error);
                    document.getElementById('cardsGrid').innerHTML = `
                        <div class="status-message" style="color: #c00;">
                            <strong>讀取資料失敗！</strong><br>
                            請確認檔案「植栽知識庫.xlsx」已放在正確目錄，且工作表名稱為「知識庫」。
                        </div>
                    `;
                });
        }

        function renderPage() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const totalItems = allData.length;
            if (totalItems === 0) {
                grid.innerHTML = '<div class="status-message">目前尚無知識庫文章資料。</div>';
                document.getElementById('paginationBox').style.display = 'none';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
            const pageData = allData.slice(startIndex, endIndex);

            pageData.forEach((item, index) => {
                const titleText = item.title || '未命名文章';
                const tagText = item.categoryTag || '未分類';
                const imgSrc = item.imgName ? `images/${item.imgName}` : '';
                const realIndex = startIndex + index;

                const card = document.createElement('div');
                card.className = 'journal-card';
                card.onclick = function() {
                    window.location.href = `knowledge-detail.html?id=${realIndex}`;
                };

                card.innerHTML = `
                    <div class="card-img-box">
                        ${imgSrc ? `<img src="${imgSrc}" alt="${titleText}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'color:#888;font-size:1.2rem;\\'>圖片</span>';">` : '<span style="color:#888;font-size:1.2rem;">圖片</span>'}
                    </div>
                    <div class="card-category-tag">${tagText}</div>
                    <div class="card-title-text">${titleText}</div>
                `;
                grid.appendChild(card);
            });

            renderPagination(totalItems);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const paginationBox = document.getElementById('paginationBox');
            const pageNumbersDiv = document.getElementById('pageNumbers');
            
            if (totalPages <= 1) {
                paginationBox.style.display = 'none';
                return;
            }

            paginationBox.style.display = 'flex';
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages);

            pageNumbersDiv.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const pageSpan = document.createElement('span');
                pageSpan.className = `page-num ${i === currentPage ? 'active' : ''}`;
                pageSpan.innerText = i;
                pageSpan.onclick = function() {
                    currentPage = i;
                    renderPage();
                };
                pageNumbersDiv.appendChild(pageSpan);
            }
        }

        function changePage(direction) {
            const totalPages = Math.ceil(allData.length / itemsPerPage);
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage();
            }
        }
    </script>
</body>
</html>
