<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!--【植栽知識庫列表】
        目的：讀取知識庫 Excel 資料，產生分類標籤、卡片與分頁。
        HTML 管理內容與結構；CSS 管理外觀；JavaScript 管理互動與資料。
        提醒：id / class 常被 CSS 與 JS 引用，修改名稱前應先搜尋全站。
        若涉及商品、文章、購物車，則保留路徑與既有資料格式。
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="胖肉多的種植雜記：植栽知識庫，分享植物照護與栽培知識。">
    <title>胖肉多的種植雜記 - 植栽知識庫</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <script src="./js/main.js" defer></script>
    <style>
        /*【說明】以下是此頁專屬 CSS；共用導覽列、登入視窗與頁尾放在 css/style.css。
          選擇器 .class 會套用至指定 class 的元素；@media 負責依螢幕寬度調整排版。 */
/* ===== 「植栽知識庫」頁面專用樣式 ===== */
.journal-wrapper {
    max-width: 1200px;
    margin: 30px auto 50px auto;
    padding: 0 20px;
}
.journal-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
}
.journal-header .line {
    height: 3px;
    width: 180px;
    background-color: #3b669e;
}
.journal-header h1 {
    font-size: 2.2rem;
    color: #1a1a1a;
    font-weight: bold;
    letter-spacing: 2px;
}
.cards-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
    align-items: start;
}
.journal-card {
    border: 2px solid #3b669e;
    border-radius: 12px;
    padding: 12px;
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.journal-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(59, 102, 158, 0.2);
}
.journal-card:focus-visible {
    outline: 3px solid #1d3557;
    outline-offset: 3px;
}
.card-img-box {
    width: 100%;
    height: 180px;
    border: 2px solid #3b669e;
    border-radius: 8px;
    overflow: hidden;
    background-color: #f9f9f9;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card-category-tag {
    margin-top: 12px;
    font-size: 0.95rem;
    color: #3b669e;
    background-color: #f0f4f9;
    border: 1px solid #3b669e;
    border-radius: 20px;
    padding: 2px 12px;
    font-weight: 600;
    text-align: center;
}
.card-title-text {
    margin-top: 8px;
    margin-bottom: 8px;
    font-size: 1.1rem;
    color: #333333;
    font-weight: 500;
    text-align: center;
    line-height: 1.4;
    width: 100%;
    word-break: break-word;
}
.pagination-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-top: 40px;
    font-size: 1.15rem;
    color: #333333;
}
.page-btn {
    background: none;
    border: none;
    font-size: 1.15rem;
    cursor: pointer;
    color: #333333;
    padding: 5px 10px;
    transition: color 0.2s ease;
}
.page-btn:hover:not(:disabled) {
    color: #3b669e;
    font-weight: bold;
}
.page-btn:disabled {
    color: #ccc;
    cursor: not-allowed;
}
.page-numbers {
    display: flex;
    gap: 10px;
    align-items: center;
}
.page-num {
    cursor: pointer;
    padding: 2px 8px;
    border: 0;
    background: transparent;
    border-radius: 4px;
    color: inherit;
    font: inherit;
}
.page-num.active {
    font-weight: bold;
    color: #3b669e;
    text-decoration: underline;
}
.page-num:focus-visible, .page-btn:focus-visible {
    outline: 2px solid #1d3557;
    outline-offset: 2px;
}
.status-message {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.2rem;
    color: #666;
    padding: 30px 0;
    line-height: 1.8;
}
@media (max-width: 992px) {
    .cards-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 768px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
    .cards-grid { grid-template-columns: 1fr; }
}
    </style>
    <script defer src="./js/login-notice.js"></script>
</head>
    <!--【說明】body 是可見頁面內容的起點；此處的 data-page 若存在，供 main.js 判斷頁面類型。 -->
<body data-page="knowledge">
    <!-- 頂部導覽列 (Navbar) -->
    <!--【說明】共用導覽列：使用 css/style.css；menuToggle、navMenu、loginModal 等元素由 JS 控制。 -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>
            <nav class="nav-menu" id="navMenu" aria-label="主要導覽">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html" class="active" aria-current="page">植栽知識庫</a>
                <a href="./Shop.html">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>
            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount" aria-label="購物車">🛒 (0)</a>
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單" aria-expanded="false" aria-controls="navMenu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <!--【說明】main 裡是本頁的主要內容；動態內容容器通常由 JS 依 id 尋找並填入資料。 -->
    <main class="journal-wrapper">
        <div class="journal-header">
            <div class="line" aria-hidden="true"></div>
            <h1>植栽知識庫</h1>
            <div class="line" aria-hidden="true"></div>
        </div>
        <div class="cards-grid" id="cardsGrid" aria-live="polite">
            <div class="status-message">資料載入中...</div>
        </div>
        <div class="pagination-container" id="paginationBox" style="display: none;" aria-label="知識庫分頁">
            <button type="button" class="page-btn" id="prevBtn">上一頁</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button type="button" class="page-btn" id="nextBtn">下一頁</button>
        </div>
    </main>

    <!-- 會員登入浮動視窗 (Modal) -->
    <!--【說明】登入展示視窗：送出表單只顯示提示，沒有實際帳號驗證或伺服器登入。 -->
    <div class="modal-overlay" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn" aria-label="關閉登入視窗">&times;</button>
            <h2 id="loginModalTitle">會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

            </div>

                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="./maintenance.html">隱私權政策</a> /
                <a href="./maintenance.html">購物與退換貨須知</a> /
                <a href="./maintenance.html">常見問題 FAQ</a>
            </div>
        </div>
    </footer>
</body>
</html>
