<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 植栽知識庫</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 引入 SheetJS 解析 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        /* ==========================================================================
           「植栽知識庫」列表頁專用網頁樣式
           ========================================================================== */
        
        .journal-wrapper {
            max-width: 1200px;
            margin: 30px auto 50px auto;
            padding: 0 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        /* 頁面標題與藍色裝飾線 */
        .journal-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .journal-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }

        .journal-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        /* 4 欄 × 3 列卡片網格 (每頁最多 12 筆) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            align-items: start;
        }

        /* 單一張知識庫卡片 */
        .journal-card {
            border: 2px solid #3b669e;
            border-radius: 12px;
            padding: 12px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .journal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(59, 102, 158, 0.2);
        }

        /* 圖片外框 (對應 F 欄圖檔) */
        .card-img-box {
            width: 100%;
            height: 180px;
            border: 2px solid #3b669e;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 分類標籤樣式 (對應 B欄 + C欄) */
        .card-category-tag {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #3b669e;
            background-color: #f0f4f9;
            border: 1px solid #3b669e;
            border-radius: 20px;
            padding: 2px 12px;
            font-weight: 600;
            text-align: center;
        }

        /* 文章標題區塊 (對應 D欄內容) */
        .card-title-text {
            margin-top: 8px;
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: #333333;
            font-weight: 500;
            text-align: center;
            line-height: 1.4;
            width: 100%;
            word-break: break-word;
        }

        /* 分頁控制區塊 */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 40px;
            font-size: 1.15rem;
            color: #333333;
        }

        .page-btn {
            background: none;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            color: #333333;
            padding: 5px 10px;
            transition: color 0.2s ease;
        }

        .page-btn:hover:not(:disabled) {
            color: #3b669e;
            font-weight: bold;
        }

        .page-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-num {
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .page-num.active {
            font-weight: bold;
            color: #3b669e;
            text-decoration: underline;
        }

        /* 提示訊息 */
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            padding: 30px 0;
            line-height: 1.8;
        }

        /* 響應式佈局 */
        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="images/logo.jpg" alt="胖肉多的種植雜記 Logo">
                <span>胖肉多的種植雜記</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html">首頁</a>
                <a href="Journal.html">種植雜記</a>
                <a href="Knowledge.html" class="active">植栽知識庫</a>
                <a href="Shop.html">資材選物店</a>
                <a href="BrandStory.html">品牌故事</a>
                <a href="ContactUs.html">聯絡我們</a>
            </nav>
            <div class="nav-icons">
                <a href="#" class="search-btn">🔍</a>
                <a href="cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="journal-wrapper">
        
        <!-- 頁面標題 -->
        <div class="journal-header">
            <div class="line"></div>
            <h1>植栽知識庫</h1>
            <div class="line"></div>
        </div>

        <!-- 卡片展示區域 -->
        <div class="cards-grid" id="cardsGrid">
            <div class="status-message">資料載入中...</div>
        </div>

        <!-- 分頁控制導覽 -->
        <div class="pagination-container" id="paginationBox" style="display: none;">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一頁</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一頁</button>
        </div>

    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="#">隱私權政策</a> / 
                <a href="#">購物與退換貨須知</a> / 
                <a href="#">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯：讀取 植栽知識庫.xlsx 與渲染卡片 -->
    <script>
        let allData = [];
        let currentPage = 1;
        const itemsPerPage = 12;

        document.addEventListener("DOMContentLoaded", function() {
            loadExcelData();
        });

        // 讀取「植栽知識庫.xlsx」
        function loadExcelData() {
            // 使用 encodeURIComponent 處理中文檔名，防範網址解析問題
            const fileName = encodeURIComponent('植栽知識庫.xlsx');

            fetch(`./${fileName}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('無法讀取 植栽知識庫.xlsx 檔案');
                    }
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // 取得「知識庫」資料表
                    const sheetName = '知識庫';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        throw new Error(`找不到名為「${sheetName}」的資料表`);
                    }
                    
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonObjects = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                    allData = [];
                    for (let i = 1; i < jsonRows.length; i++) {
                        const rowArray = jsonRows[i];
                        const rowObj = jsonObjects[i - 1] || {};

                        if (!rowArray || rowArray.length === 0 || rowArray.every(cell => cell === '')) {
                            continue;
                        }

                        let categoryMain = ''; // B欄
                        let categorySub = '';  // C欄
                        let title = '';        // D欄
                        let imgName = '';      // F欄

                        // 物件 Key 自動解析
                        Object.keys(rowObj).forEach(key => {
                            const cleanKey = key.trim();
                            if (cleanKey === '主分類' || cleanKey.includes('主分類')) categoryMain = rowObj[key];
                            if (cleanKey === '次分類' || cleanKey.includes('次分類')) categorySub = rowObj[key];
                            if (cleanKey === '文章標題' || cleanKey === '標題' || cleanKey.includes('標題')) title = rowObj[key];
                            if (cleanKey === '圖檔檔名' || cleanKey.includes('圖檔') || cleanKey.includes('檔名')) imgName = rowObj[key];
                        });

                        // 索引備援方案：B欄 (index 1), C欄 (index 2), D欄 (index 3), F欄 (index 5)
                        if (!categoryMain && rowArray[1] !== undefined) categoryMain = rowArray[1];
                        if (!categorySub && rowArray[2] !== undefined) categorySub = rowArray[2];
                        if (!title && rowArray[3] !== undefined) title = rowArray[3];
                        if (!imgName && rowArray[5] !== undefined) imgName = rowArray[5];

                        // 組合 B欄 + C欄 作為分類標籤
                        let categoryTag = '';
                        const mainStr = String(categoryMain).trim();
                        const subStr = String(categorySub).trim();
                        if (mainStr && subStr) {
                            categoryTag = `${mainStr} / ${subStr}`;
                        } else {
                            categoryTag = mainStr || subStr;
                        }

                        allData.push({
                            categoryTag: categoryTag,
                            title: String(title).trim(),
                            imgName: String(imgName).trim()
                        });
                    }

                    currentPage = 1;
                    renderPage();
                })
                .catch(error => {
                    console.error('讀取失敗:', error);
                    document.getElementById('cardsGrid').innerHTML = `
                        <div class="status-message" style="color: #c00;">
                            <strong>讀取資料失敗！</strong><br>
                            1. 請確認檔案「植栽知識庫.xlsx」已放在與本網頁相同的目錄下，且工作表名稱為「知識庫」。<br>
                            2. <strong>重要：</strong>若您是直接雙擊開啟 HTML 檔案 (網址列為 file:///)，瀏覽器安全性機制會阻擋 JavaScript 讀取本地 Excel。<br>
                            請使用 <strong>VS Code 的 Live Server</strong> 或本地 HTTP 伺服器開啟此頁面。
                        </div>
                    `;
                });
        }

        // 渲染頁面卡片
        function renderPage() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const totalItems = allData.length;
            if (totalItems === 0) {
                grid.innerHTML = '<div class="status-message">目前尚無知識庫文章資料。</div>';
                document.getElementById('paginationBox').style.display = 'none';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
            const pageData = allData.slice(startIndex, endIndex);

            pageData.forEach((item, index) => {
                const titleText = item.title || '未命名文章';
                const tagText = item.categoryTag || '未分類';
                const imgSrc = item.imgName ? `images/${item.imgName}` : '';
                const realIndex = startIndex + index;

                const card = document.createElement('div');
                card.className = 'journal-card';
                
                // 點擊後帶入 ID 跳轉至 knowledge-detail.html
                card.onclick = function() {
                    window.location.href = `knowledge-detail.html?id=${realIndex}`;
                };

                card.innerHTML = `
                    <div class="card-img-box">
                        ${imgSrc ? `<img src="${imgSrc}" alt="${titleText}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'color:#888;font-size:1.2rem;\\'>圖片</span>';">` : '<span style="color:#888;font-size:1.2rem;">圖片</span>'}
                    </div>
                    <div class="card-category-tag">${tagText}</div>
                    <div class="card-title-text">${titleText}</div>
                `;
                grid.appendChild(card);
            });

            renderPagination(totalItems);
        }

        // 渲染分頁 UI
        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const paginationBox = document.getElementById('paginationBox');
            const pageNumbersDiv = document.getElementById('pageNumbers');
            
            if (totalPages <= 1) {
                paginationBox.style.display = 'none';
                return;
            }

            paginationBox.style.display = 'flex';
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages);

            pageNumbersDiv.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const pageSpan = document.createElement('span');
                pageSpan.className = `page-num ${i === currentPage ? 'active' : ''}`;
                pageSpan.innerText = i;
                pageSpan.onclick = function() {
                    currentPage = i;
                    renderPage();
                };
                pageNumbersDiv.appendChild(pageSpan);
            }
        }

        // 切換頁面
        function changePage(direction) {
            const totalPages = Math.ceil(allData.length / itemsPerPage);
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage();
            }
        }
    </script>
    <script src="js/main.js"></script>
</body>
