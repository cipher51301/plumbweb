<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 所有商品</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 引入 SheetJS 解析 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        /* ===== 頂部導覽列基本與響應式樣式 ===== */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .logo span {
            font-size: 20px;
            font-weight: bold;
            color: #333333;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-menu a {
            text-decoration: none;
            color: #333333;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #1d3557;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle {
            display: none;
            background-color: #000033;
            border: 2px solid #0056b3;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            flex-direction: column;
            justify-content: space-around;
            width: 42px;
            height: 38px;
            box-sizing: border-box;
        }
        .menu-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .auth-btn {
            display: inline-block;
            padding: 4px 12px;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            color: #1d3557;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
            background: transparent;
        }
        .auth-btn:hover {
            background-color: #1d3557;
            color: #ffffff;
        }

        .cart-btn {
            text-decoration: none;
            color: #333333;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                right: 0;
                width: 220px;
                background-color: #ffffff;
                border: 2.5px solid #0056b3;
                box-shadow: -4px 6px 15px rgba(0,0,0,0.15);
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 20px;
                gap: 18px;
                z-index: 1001;
            }

            .nav-menu.active {
                display: flex;
            }

            .nav-menu a {
                font-size: 22px;
                color: #222222;
                text-decoration: none;
                width: 100%;
                display: block;
                font-weight: normal;
            }
        }

        /* ===== 登入彈出視窗 (Modal) 樣式 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .login-modal {
            background-color: #ffffff;
            border: 2px solid #1d3557;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            box-sizing: border-box;
        }
        .login-modal .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
        }
        .login-modal .close-btn:hover {
            color: #000;
        }
        .login-modal h2 {
            text-align: center;
            font-size: 26px;
            color: #111;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: normal;
            letter-spacing: 2px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            font-size: 18px;
            color: #111;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .login-form input::placeholder {
            color: #b5b5b5;
            font-size: 13px;
        }
        .login-form .submit-btn {
            width: 100%;
            background-color: #00b04f;
            color: #ffffff;
            border: 1.5px solid #1d3557;
            border-radius: 6px;
            padding: 10px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
            letter-spacing: 4px;
        }
        .login-form .submit-btn:hover {
            background-color: #009643;
        }

        /* ===== 「所有商品」頁面專用樣式 ===== */
        .products-wrapper {
            max-width: 1200px;
            margin: 30px auto 50px auto;
            padding: 0 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .products-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .products-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }

        .products-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            align-items: start;
        }

        .product-card {
            border: 2px solid #3b669e;
            border-radius: 12px;
            padding: 12px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(59, 102, 158, 0.2);
        }

        .card-img-box {
            width: 100%;
            height: 180px;
            border: 2px solid #3b669e;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info-box {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding: 0 4px;
        }

        .card-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            padding-right: 8px;
        }

        .card-title-text {
            font-size: 1.1rem;
            color: #333333;
            font-weight: 500;
            line-height: 1.3;
            word-break: break-word;
        }

        .card-price-text {
            font-size: 1.1rem;
            color: #222222;
            font-weight: bold;
        }

        .cart-icon-btn {
            background: none;
            border: 2px solid #3b669e;
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: #3b669e;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .cart-icon-btn:hover {
            background-color: #3b669e;
            color: #ffffff;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 40px;
            font-size: 1.15rem;
            color: #333333;
        }

        .page-btn {
            background: none;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            color: #333333;
            padding: 5px 10px;
            transition: color 0.2s ease;
        }

        .page-btn:hover:not(:disabled) {
            color: #3b669e;
            font-weight: bold;
        }

        .page-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-num {
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .page-num.active {
            font-weight: bold;
            color: #3b669e;
            text-decoration: underline;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            padding: 30px 0;
        }

        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>

            <nav class="nav-menu" id="navMenu">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./Shop.html" class="active">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>

            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
                
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="products-wrapper">
        <div class="products-header">
            <div class="line"></div>
            <h1>所有商品</h1>
            <div class="line"></div>
        </div>

        <div class="cards-grid" id="cardsGrid">
            <div class="status-message">商品資料載入中...</div>
        </div>

        <div class="pagination-container" id="paginationBox" style="display: none;">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一頁</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一頁</button>
        </div>
    </div>

    <!-- 會員登入浮動視窗 (Modal) -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
            <h2>會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="#">隱私權政策</a> / 
                <a href="#">購物與退換貨須知</a> / 
                <a href="#">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯 -->
    <script>
        let allProducts = [];
        let currentPage = 1;
        const itemsPerPage = 12;

        document.addEventListener("DOMContentLoaded", function() {
            updateCartIconCount();
            initNavAndModal();
            loadExcelData();
        });

        function updateCartIconCount() {
            try {
                let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
                let totalCount = cart.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
                const cartNavBtn = document.getElementById('navCartCount');
                if (cartNavBtn) {
                    cartNavBtn.innerText = `🛒 (${totalCount})`;
                }
            } catch (e) {
                console.error("購物車數量解析失敗:", e);
            }
        }

        function initNavAndModal() {
            const menuToggle = document.getElementById("menuToggle");
            const navMenu = document.getElementById("navMenu");

            if (menuToggle && navMenu) {
                menuToggle.addEventListener("click", function (e) {
                    e.stopPropagation();
                    navMenu.classList.toggle("active");
                });

                document.addEventListener("click", function (e) {
                    if (!navMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        navMenu.classList.remove("active");
                    }
                });
            }

            const triggerAuthBtns = document.querySelectorAll(".trigger-auth-btn");
            const loginModal = document.getElementById("loginModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const loginForm = document.getElementById("loginForm");

            triggerAuthBtns.forEach(btn => {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    if (navMenu) navMenu.classList.remove("active");
                    loginModal.classList.add("active");
                });
            });

            if (closeModalBtn) {
                closeModalBtn.addEventListener("click", function () {
                    loginModal.classList.remove("active");
                });
            }

            if (loginModal) {
                loginModal.addEventListener("click", function (e) {
                    if (e.target === loginModal) {
                        loginModal.classList.remove("active");
                    }
                });
            }

            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    alert("此視窗僅供展示使用，無實際登入功能。");
                    loginForm.reset();
                    loginModal.classList.remove("active");
                });
            }
        }

        function loadExcelData() {
            fetch('多肉與玫瑰產品統計表.xlsx')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('無法讀取 多肉與玫瑰產品統計表.xlsx 檔案');
                    }
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = '商品彙整';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        throw new Error(`找不到名為「${sheetName}」的資料表`);
                    }
                    
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonObjects = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                    allProducts = [];
                    for (let i = 1; i < jsonRows.length; i++) {
                        const rowArray = jsonRows[i];
                        const rowObj = jsonObjects[i - 1] || {};

                        if (!rowArray || rowArray.length === 0 || rowArray.every(cell => cell === '')) {
                            continue;
                        }

                        let name = '';
                        let price = '';
                        let imgName = '';

                        Object.keys(rowObj).forEach(key => {
                            const cleanKey = key.trim();
                            if (cleanKey === '商品名稱' || cleanKey === '名稱' || cleanKey.includes('名稱')) name = rowObj[key];
                            if (cleanKey === '價格' || cleanKey === '售價' || cleanKey.includes('價格')) price = rowObj[key];
                            if (cleanKey === '圖檔檔名' || cleanKey.includes('圖檔') || cleanKey.includes('檔名')) imgName = rowObj[key];
                        });

                        if (!name && rowArray[2] !== undefined) name = rowArray[2];
                        if (!price && rowArray[3] !== undefined) price = rowArray[3];
                        if (!imgName && rowArray[5] !== undefined) imgName = rowArray[5];

                        let formattedPrice = price;
                        if (typeof price === 'number') {
                            formattedPrice = `NT$ ${price.toLocaleString()}`;
                        } else if (price && !String(price).includes('NT$')) {
                            formattedPrice = `NT$ ${price}`;
                        }

                        allProducts.push({
                            id: i - 1,
                            name: String(name).trim(),
                            price: formattedPrice || 'NT$ 0',
                            rawPrice: price,
                            imgName: String(imgName).trim()
                        });
                    }

                    currentPage = 1;
                    renderPage();
                })
                .catch(error => {
                    console.error('讀取失敗:', error);
                    document.getElementById('cardsGrid').innerHTML = `
                        <div class="status-message" style="color: #c00;">
                            讀取資料失敗，請確認同目錄下是否存在「多肉與玫瑰產品統計表.xlsx」檔案，且包含「商品彙整」資料表。
                        </div>
                    `;
                });
        }

        function renderPage() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const totalItems = allProducts.length;
            if (totalItems === 0) {
                grid.innerHTML = '<div class="status-message">目前尚無商品資料。</div>';
                document.getElementById('paginationBox').style.display = 'none';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
            const pageData = allProducts.slice(startIndex, endIndex);

            pageData.forEach((item, index) => {
                const nameText = item.name || '精選商品';
                const priceText = item.price || 'NT$ 0';
                const imgSrc = item.imgName ? `images/${item.imgName}` : '';
                const realIndex = startIndex + index;

                const card = document.createElement('div');
                card.className = 'product-card';
                
                card.onclick = function(e) {
                    if (e.target.closest('.cart-icon-btn')) return;
                    window.location.href = `product-detail.html?id=${realIndex}`;
                };

                card.innerHTML = `
                    <div class="card-img-box">
                        ${imgSrc ? `<img src="${imgSrc}" alt="${nameText}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'color:#888;font-size:1.2rem;\\'>圖片</span>';">` : '<span style="color:#888;font-size:1.2rem;">圖片</span>'}
                    </div>
                    <div class="card-info-box">
                        <div class="card-text-group">
                            <div class="card-title-text">${nameText}</div>
                            <div class="card-price-text">${priceText}</div>
                        </div>
                        <button class="cart-icon-btn" title="加入購物車" onclick="addToCart(event, ${realIndex})">
                            🛒
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination(totalItems);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const paginationBox = document.getElementById('paginationBox');
            const pageNumbersDiv = document.getElementById('pageNumbers');
            
            if (totalPages <= 1) {
                paginationBox.style.display = 'none';
                return;
            }

            paginationBox.style.display = 'flex';
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages);

            pageNumbersDiv.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const pageSpan = document.createElement('span');
                pageSpan.className = `page-num ${i === currentPage ? 'active' : ''}`;
                pageSpan.innerText = i;
                pageSpan.onclick = function() {
                    currentPage = i;
                    renderPage();
                };
                pageNumbersDiv.appendChild(pageSpan);
            }
        }

        function changePage(direction) {
            const totalPages = Math.ceil(allProducts.length / itemsPerPage);
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage();
            }
        }

        function addToCart(event, productIndex) {
            event.stopPropagation();
            const product = allProducts[productIndex];
            if (!product) return;

            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            const existingItem = cart.find(item => item.name === product.name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: productIndex,
                    name: product.name,
                    price: product.price,
                    imgName: product.imgName,
                    quantity: 1
                });
            }

            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            updateCartIconCount();

            alert(`已將「${product.name}」加入購物車！`);
        }
    </script>
</body>
</html>
