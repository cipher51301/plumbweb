<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖肉多的種植雜記 - 所有商品</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 引入 SheetJS 解析 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        /* ==========================================================================
           「所有商品」頁面專用樣式 (依據草圖精確還原)
           ========================================================================== */
        
        .products-wrapper {
            max-width: 1200px;
            margin: 30px auto 50px auto;
            padding: 0 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        /* 標題與藍色裝飾線 */
        .products-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .products-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }

        .products-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        /* 4 欄 × 3 列卡片網格 (每頁最多 12 筆) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            align-items: start;
        }

        /* 單一張商品卡片 (邊框與圓角設計) */
        .product-card {
            border: 2px solid #3b669e;
            border-radius: 12px;
            padding: 12px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(59, 102, 158, 0.2);
        }

        /* 圖片外框 (對應 F 欄) */
        .card-img-box {
            width: 100%;
            height: 180px;
            border: 2px solid #3b669e;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 商品資訊與購物車按鈕區塊 */
        .card-info-box {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding: 0 4px;
        }

        .card-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            padding-right: 8px;
        }

        /* 商品名稱 (對應 C 欄) */
        .card-title-text {
            font-size: 1.1rem;
            color: #333333;
            font-weight: 500;
            line-height: 1.3;
            word-break: break-word;
        }

        /* 商品價格 (對應 D 欄) */
        .card-price-text {
            font-size: 1.1rem;
            color: #222222;
            font-weight: bold;
        }

        /* 右下角購物車圖示按鈕 */
        .cart-icon-btn {
            background: none;
            border: 2px solid #3b669e;
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: #3b669e;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .cart-icon-btn:hover {
            background-color: #3b669e;
            color: #ffffff;
        }

        /* 分頁控制區塊 */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 40px;
            font-size: 1.15rem;
            color: #333333;
        }

        .page-btn {
            background: none;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            color: #333333;
            padding: 5px 10px;
            transition: color 0.2s ease;
        }

        .page-btn:hover:not(:disabled) {
            color: #3b669e;
            font-weight: bold;
        }

        .page-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-num {
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .page-num.active {
            font-weight: bold;
            color: #3b669e;
            text-decoration: underline;
        }

        /* 提示訊息 */
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            padding: 30px 0;
        }

        /* 響應式佈局 */
        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="images/logo.jpg" alt="胖肉多的種植雜記 Logo">
                <span>胖肉多的種植雜記</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html">首頁</a>
                <a href="Journal.html">種植雜記</a>
                <a href="Knowledge.html">植栽知識庫</a>
                <a href="products.html" class="active">所有商品</a>
                <a href="BrandStory.html">品牌故事</a>
                <a href="ContactUs.html">聯絡我們</a>
            </nav>
            <div class="nav-icons">
                <a href="#" class="search-btn">🔍</a>
                <a href="cart.html" class="cart-btn" id="navCartCount">🛒 (0)</a>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="products-wrapper">
        
        <!-- 頁面標題 -->
        <div class="products-header">
            <div class="line"></div>
            <h1>所有商品</h1>
            <div class="line"></div>
        </div>

        <!-- 商品卡片展示區域 (動態產生) -->
        <div class="cards-grid" id="cardsGrid">
            <div class="status-message">商品資料載入中...</div>
        </div>

        <!-- 分頁控制導覽 -->
        <div class="pagination-container" id="paginationBox" style="display: none;">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一頁</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一頁</button>
        </div>

    </div>

    <!-- 頁尾 Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="#">隱私權政策</a> / 
                <a href="#">購物與退換貨須知</a> / 
                <a href="#">常見問題 FAQ</a>
            </div>
        </div>
    </footer>

    <!-- JS 邏輯：讀取 多肉與玫瑰產品統計表.xlsx 與購物車互動 -->
    <script>
        let allProducts = [];
        let currentPage = 1;
        const itemsPerPage = 12; // 每一頁顯示 12 筆商品

        document.addEventListener("DOMContentLoaded", function() {
            updateCartIconCount();
            loadExcelData();
        });

        // 讀取同目錄下的「多肉與玫瑰產品統計表.xlsx」
        function loadExcelData() {
            fetch('多肉與玫瑰產品統計表.xlsx')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('無法讀取 多肉與玫瑰產品統計表.xlsx 檔案');
                    }
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // 取得「商品彙整」資料表
                    const sheetName = '商品彙整';
                    if (!workbook.SheetNames.includes(sheetName)) {
                        throw new Error(`找不到名為「${sheetName}」的資料表`);
                    }
                    
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonObjects = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                    allProducts = [];
                    for (let i = 1; i < jsonRows.length; i++) {
                        const rowArray = jsonRows[i];
                        const rowObj = jsonObjects[i - 1] || {};

                        if (!rowArray || rowArray.length === 0 || rowArray.every(cell => cell === '')) {
                            continue;
                        }

                        let name = '';     // C 欄 (index 2)
                        let price = '';    // D 欄 (index 3)
                        let imgName = '';  // F 欄 (index 5)

                        // 優先利用 Key 自動對應
                        Object.keys(rowObj).forEach(key => {
                            const cleanKey = key.trim();
                            if (cleanKey === '商品名稱' || cleanKey === '名稱' || cleanKey.includes('名稱')) name = rowObj[key];
                            if (cleanKey === '價格' || cleanKey === '售價' || cleanKey.includes('價格')) price = rowObj[key];
                            if (cleanKey === '圖檔檔名' || cleanKey.includes('圖檔') || cleanKey.includes('檔名')) imgName = rowObj[key];
                        });

                        // 備援索引對應：C欄(2), D欄(3), F欄(5)
                        if (!name && rowArray[2] !== undefined) name = rowArray[2];
                        if (!price && rowArray[3] !== undefined) price = rowArray[3];
                        if (!imgName && rowArray[5] !== undefined) imgName = rowArray[5];

                        // 格式化價格
                        let formattedPrice = price;
                        if (typeof price === 'number') {
                            formattedPrice = `NT$ ${price.toLocaleString()}`;
                        } else if (price && !String(price).includes('NT$')) {
                            formattedPrice = `NT$ ${price}`;
                        }

                        allProducts.push({
                            id: i - 1,
                            name: String(name).trim(),
                            price: formattedPrice || 'NT$ 0',
                            rawPrice: price,
                            imgName: String(imgName).trim()
                        });
                    }

                    currentPage = 1;
                    renderPage();
                })
                .catch(error => {
                    console.error('讀取失敗:', error);
                    document.getElementById('cardsGrid').innerHTML = `
                        <div class="status-message" style="color: #c00;">
                            讀取資料失敗，請確認同目錄下是否存在「多肉與玫瑰產品統計表.xlsx」檔案，且包含「商品彙整」資料表。
                        </div>
                    `;
                });
        }

        // 渲染商品卡片
        function renderPage() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const totalItems = allProducts.length;
            if (totalItems === 0) {
                grid.innerHTML = '<div class="status-message">目前尚無商品資料。</div>';
                document.getElementById('paginationBox').style.display = 'none';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
            const pageData = allProducts.slice(startIndex, endIndex);

            pageData.forEach((item, index) => {
                const nameText = item.name || '精選商品';
                const priceText = item.price || 'NT$ 0';
                const imgSrc = item.imgName ? `images/${item.imgName}` : '';
                const realIndex = startIndex + index;

                const card = document.createElement('div');
                card.className = 'product-card';
                
                // 點擊卡片本體跳轉至商品單頁 product-detail.html
                card.onclick = function(e) {
                    // 若點擊的是購物車按鈕，則不觸發頁面跳轉
                    if (e.target.closest('.cart-icon-btn')) return;
                    window.location.href = `product-detail.html?id=${realIndex}`;
                };

                card.innerHTML = `
                    <div class="card-img-box">
                        ${imgSrc ? `<img src="${imgSrc}" alt="${nameText}" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\\'color:#888;font-size:1.2rem;\\'>圖片</span>';">` : '<span style="color:#888;font-size:1.2rem;">圖片</span>'}
                    </div>
                    <div class="card-info-box">
                        <div class="card-text-group">
                            <div class="card-title-text">${nameText}</div>
                            <div class="card-price-text">${priceText}</div>
                        </div>
                        <button class="cart-icon-btn" title="加入購物車" onclick="addToCart(event, ${realIndex})">
                            🛒
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination(totalItems);
        }

        // 分頁按鈕渲染
        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const paginationBox = document.getElementById('paginationBox');
            const pageNumbersDiv = document.getElementById('pageNumbers');
            
            if (totalPages <= 1) {
                paginationBox.style.display = 'none';
                return;
            }

            paginationBox.style.display = 'flex';
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages);

            pageNumbersDiv.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const pageSpan = document.createElement('span');
                pageSpan.className = `page-num ${i === currentPage ? 'active' : ''}`;
                pageSpan.innerText = i;
                pageSpan.onclick = function() {
                    currentPage = i;
                    renderPage();
                };
                pageNumbersDiv.appendChild(pageSpan);
            }
        }

        // 頁面切換
        function changePage(direction) {
            const totalPages = Math.ceil(allProducts.length / itemsPerPage);
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage();
            }
        }

        // 加入購物車邏輯 (使用 localStorage)
        function addToCart(event, productIndex) {
            event.stopPropagation(); // 阻止冒泡觸發卡片點擊事件
            const product = allProducts[productIndex];
            if (!product) return;

            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            
            // 檢查購物車內是否已有該商品
            const existingItem = cart.find(item => item.name === product.name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: productIndex,
                    name: product.name,
                    price: product.price,
                    imgName: product.imgName,
                    quantity: 1
                });
            }

            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            updateCartIconCount();

            alert(`已將「${product.name}」加入購物車！`);
        }

        // 更新頂部導覽列購物車數量
        function updateCartIconCount() {
            let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartNavBtn = document.getElementById('navCartCount');
            if (cartNavBtn) {
                cartNavBtn.innerText = `🛒 (${totalCount})`;
            }
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
