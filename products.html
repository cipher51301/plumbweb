<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="胖肉多的種植雜記資材選物店，瀏覽多肉植物與玫瑰相關商品。">
    <title>胖肉多的種植雜記 - 所有商品</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="./js/main.js"></script>
    <style>
        /* 商品列表專用樣式；導覽列、登入視窗與頁尾共用 css/style.css */
        .products-wrapper {
            max-width: 1200px;
            margin: 30px auto 50px;
            padding: 0 20px;
        }
        .products-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .products-header .line {
            height: 3px;
            width: 180px;
            background-color: #3b669e;
        }
        .products-header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            align-items: start;
        }
        .product-card {
            border: 2px solid #3b669e;
            border-radius: 12px;
            padding: 12px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .product-card:hover,
        .product-card:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(59, 102, 158, .2);
            outline: none;
        }
        .card-img-box {
            width: 100%;
            height: 180px;
            border: 2px solid #3b669e;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-info-box {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding: 0 4px;
        }
        .card-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            padding-right: 8px;
            min-width: 0;
        }
        .card-title-text {
            font-size: 1.1rem;
            color: #333;
            font-weight: 500;
            line-height: 1.3;
            word-break: break-word;
        }
        .card-price-text {
            font-size: 1.1rem;
            color: #222;
            font-weight: bold;
        }
        .cart-icon-btn {
            background: none;
            border: 2px solid #3b669e;
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: #3b669e;
            transition: all .2s ease;
            flex-shrink: 0;
        }
        .cart-icon-btn:hover,
        .cart-icon-btn:focus-visible {
            background-color: #3b669e;
            color: #fff;
        }
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 40px;
            font-size: 1.15rem;
            color: #333;
        }
        .page-btn {
            background: none;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            color: #333;
            padding: 5px 10px;
            transition: color .2s ease;
        }
        .page-btn:hover:not(:disabled) {
            color: #3b669e;
            font-weight: bold;
        }
        .page-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }
        .page-numbers {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .page-num {
            border: 0;
            background: transparent;
            font: inherit;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            color: inherit;
        }
        .page-num.active {
            font-weight: bold;
            color: #3b669e;
            text-decoration: underline;
        }
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            padding: 30px 0;
        }
        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .products-header .line { width: min(15vw, 120px); }
            .products-header h1 { font-size: 1.8rem; }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
            .products-header { gap: 12px; }
            .products-header .line { width: 36px; }
            .products-header h1 { font-size: 1.55rem; }
        }
    </style>
</head>
<body data-page="products">
    <!-- 頂部導覽列 -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logo.jpg" alt="胖肉多的種植雜記 Logo" onerror="this.style.display='none'">
                <span>胖肉多的種植雜記</span>
            </div>
            <nav class="nav-menu" id="navMenu">
                <a href="./index.html">首頁</a>
                <a href="./Journal.html">種植雜記</a>
                <a href="./Knowledge.html">植栽知識庫</a>
                <a href="./products.html" class="active" aria-current="page">資材選物店</a>
                <a href="./BrandStory.html">品牌故事</a>
                <a href="./ContactUs.html">聯絡我們</a>
            </nav>
            <div class="nav-controls">
                <button type="button" class="auth-btn trigger-auth-btn">登入/註冊</button>
                <a href="./cart.html" class="cart-btn" id="navCartCount" aria-label="購物車">🛒 (0)</a>
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="切換選單" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="products-wrapper">
        <div class="products-header">
            <div class="line" aria-hidden="true"></div>
            <h1>所有商品</h1>
            <div class="line" aria-hidden="true"></div>
        </div>
        <div class="cards-grid" id="cardsGrid" aria-live="polite">
            <div class="status-message">商品資料載入中...</div>
        </div>
        <nav class="pagination-container" id="paginationBox" aria-label="商品分頁" style="display:none;">
            <button type="button" class="page-btn" id="prevBtn">上一頁</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button type="button" class="page-btn" id="nextBtn">下一頁</button>
        </nav>
    </main>

    <!-- 會員登入浮動視窗 -->
    <div class="modal-overlay" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
        <div class="login-modal">
            <button type="button" class="close-btn" id="closeModalBtn" aria-label="關閉登入視窗">&times;</button>
            <h2 id="loginModalTitle">會員登入</h2>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">會員帳號</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="限使用英文、數字，至少6個字元" required>
                </div>
                <button type="submit" class="submit-btn">登入</button>
            </form>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col footer-left">
                <p>版權宣告：© 2026 胖肉多的種植雜記 All Rights Reserved.</p>
            </div>
            <div class="footer-col footer-center">
                <p>站長：胖肉多</p>
                <p>連絡電話：(77)77777777</p>
                <p>連絡地址：福氣市幸福區幸運路168號</p>
            </div>
            <div class="footer-col footer-right">
                <a href="./maintenance.html">隱私權政策</a> /
                <a href="./maintenance.html">購物與退換貨須知</a> /
                <a href="./maintenance.html">常見問題 FAQ</a>
            </div>
        </div>
    </footer>
</body>
</html>
